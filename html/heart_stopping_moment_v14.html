
<script src="js/cache-bust.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; }
.page { display:flex; flex-direction:column; align-items:center; gap:18px; padding:1.5rem 1rem; }
.meter-shell {
  width:508px; height:97px; background:#0a0a0a;
  border:2px solid #222;
  position:relative; display:flex; flex-direction:row;
}
.img-slot {
  width:182px; height:100%; flex-shrink:0; background:#111;
  border-right:2px solid #222; display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.img-slot-inner {
  width:100%; height:100%;
  background: url('noise.png') repeat; background-size: auto;
}
.img-slot-label { font-family:'Anton',sans-serif; font-size:9px; letter-spacing:1.5px; color:#333; text-align:center; line-height:1.5; }
.meter-area { flex:1; display:flex; flex-direction:column; padding:8px 10px; gap:0; overflow:visible; }
.bar-track { display:flex; flex-direction:row; gap:6px; overflow:visible; }
.scale-row { height:21px; flex-shrink:0; display:flex; align-items:center; }
.scale-inner { display:flex; flex-direction:row; align-items:center; justify-content:space-between; width:100%; }
.scale-num { font-family:sans-serif; font-weight:500; font-size:11px; color:#d4d4d4; line-height:1; text-align:center; flex:1; }
.seg { flex-shrink:0; border-radius:2px; overflow:visible; }
.controls { display:flex; gap:16px; align-items:center; }
.ctrl-btn {
  width:52px; height:52px; border-radius:50%; border:none;
  font-size:28px; font-weight:bold; cursor:pointer; color:white;
  display:flex; align-items:center; justify-content:center; transition:transform 0.08s; line-height:1;
}
.ctrl-btn:active { transform:scale(0.9); }
.btn-add   { background:linear-gradient(135deg,#c02000,#ff4400); box-shadow:0 4px 16px rgba(200,60,0,0.5); }
.btn-less  { background:linear-gradient(135deg,#115530,#1e9e58); box-shadow:0 4px 16px rgba(30,158,88,0.4); }
.btn-clear { background:linear-gradient(135deg,#1a1a1a,#2e2e2e); box-shadow:0 4px 16px rgba(0,0,0,0.5); font-size:20px; }
.level-lbl { font-family:'Anton',sans-serif; font-size:17px; color:var(--color-text-secondary); min-width:58px; text-align:center; }
.server-cfg { display:flex; align-items:center; gap:8px; font-size:11px; color:#555; }
.server-cfg input { background:#111; border:1px solid #2a2a2a; color:#888; padding:3px 7px; border-radius:3px; font-size:11px; width:172px; outline:none; font-family:monospace; }
.server-cfg input:focus { border-color:#444; color:#ccc; }
.server-cfg .svr-btn { background:#181818; border:1px solid #2a2a2a; color:#666; padding:3px 9px; border-radius:3px; cursor:pointer; font-size:11px; }
.server-cfg .svr-btn:hover { border-color:#444; color:#aaa; }
.sse-dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0; }
.sse-dot.connected    { background:#1db954; box-shadow:0 0 4px #1db954; }
.sse-dot.disconnected { background:#555; }
.sse-dot.connecting   { background:#f5a623; }
#shellWrapper { }
.vis-controls { display:flex; gap:12px; align-items:center; }
.vis-btn { padding:9px 24px; border-radius:6px; border:none; font-family:'Anton',sans-serif; font-size:13px; letter-spacing:1.5px; cursor:pointer; color:white; transition:transform 0.08s; }
.vis-btn:active { transform:scale(0.95); }
.btn-show { background:linear-gradient(135deg,#004a99,#0077ee); box-shadow:0 4px 16px rgba(0,90,220,0.45); }
.btn-hide { background:linear-gradient(135deg,#1a1a1a,#2e2e2e); box-shadow:0 4px 16px rgba(0,0,0,0.5); }
</style>

<div class="page">
  <div id="shellWrapper" style="transform:translateX(540px)">
    <div class="meter-shell" id="shell">
      <div class="img-slot">
        <div class="img-slot-inner"></div>
      </div>
      <div class="meter-area">
        <div class="bar-track" id="trackA"></div>
        <div class="scale-row"><div class="scale-inner" id="scaleInner"></div></div>
        <div class="bar-track" id="trackB"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="ctrl-btn btn-less" id="btnLess">−</button>
    <div class="level-lbl" id="lvlLbl">0 / 10</div>
    <button class="ctrl-btn btn-add" id="btnAdd">+</button>
    <button class="ctrl-btn btn-clear" id="btnClear">✕</button>
  </div>
  <div class="vis-controls">
    <button class="vis-btn btn-show" id="btnShow">SHOW</button>
    <button class="vis-btn btn-hide" id="btnHide">HIDE</button>
  </div>
  <div class="server-cfg">
    <span class="sse-dot disconnected" id="sseDot" title="SSE connection"></span>
  </div>
</div>
<script>
const BASE_LEVEL = 10;
const SEG_GAP = 6, PAD_X = 10, PAD_Y = 8;
const SHELL_W = 508, SHELL_H = 97, SHELL_BORDER = 2;
const SLOT_W = 182, SLOT_BORDER = 2, SCALE_H = 21;
const METER_W = SHELL_W - SLOT_W - SLOT_BORDER - SHELL_BORDER * 2;
const AVAIL_H = SHELL_H - SHELL_BORDER * 2 - PAD_Y * 2 - SCALE_H;
const SEG_H   = Math.floor(AVAIL_H / 2);
const AVAIL_W = METER_W - PAD_X * 2;

// --- segment count ---
let SEGS = 1, SEG_W = AVAIL_W;
{ let n = 1;
  while (true) {
    const next = n + 1;
    if (Math.floor((AVAIL_W - (next - 1) * SEG_GAP) / next) < 8) break;
    n = next;
  }
  SEGS = n; SEG_W = Math.floor((AVAIL_W - (n - 1) * SEG_GAP) / n);
}

// --- colour table (built once, indexed by segment) ---
const COLOR_HEX = new Array(SEGS);
const COLOR_RGB = new Array(SEGS); // "r,g,b" strings for rgba()
for (let i = 0; i < SEGS; i++) {
  const t = i / (SEGS - 1);
  let r, g, b, h;
  if      (t < 0.55) { r=0;   g=224; b=64;  h='#00e040'; }
  else if (t < 0.68) { r=136; g=238; b=0;   h='#88ee00'; }
  else if (t < 0.78) { r=255; g=221; b=0;   h='#ffdd00'; }
  else if (t < 0.88) { r=255; g=136; b=0;   h='#ff8800'; }
  else               { r=255; g=24;  b=0;   h='#ff1800'; }
  COLOR_HEX[i] = h;
  COLOR_RGB[i] = `${r},${g},${b}`;
}

// --- pre-bake static bg strings (off state never changes) ---
const OFF_BG = COLOR_RGB.map(rgb => `rgba(${rgb},0.10)`);
const ON_BG  = COLOR_RGB.map(rgb => `rgb(${rgb})`);

// glow string cache: keyed by "segIndex|throbBucket" (throb quantised to 20 steps)
const THROB_STEPS = 20;
const glowCache = new Map();

function buildGlow(i, throbM) {
  const f = level / BASE_LEVEL;
  const hex = COLOR_HEX[i];
  if (level === BASE_LEVEL) {
    const t = throbM;
    const px0 = (1.5 + t * 4).toFixed(1);
    const px1 = (3 + t * 6).toFixed(1);
    const px2 = (7 + t * 12).toFixed(1);
    const px3 = (12 + t * 18).toFixed(1);
    const wA  = Math.round(t * 0.70 * 255).toString(16).padStart(2,'0');
    const a1 = Math.round((0.55 + t * 0.2) * 255).toString(16).padStart(2,'0');
    const a2 = Math.round((0.25 + t * 0.2) * 255).toString(16).padStart(2,'0');
    const a3 = Math.round((0.08 + t * 0.12) * 255).toString(16).padStart(2,'0');
    return `0 0 ${px0}px 1px #ffffff${wA},0 0 ${px1}px 1px ${hex}${a1},0 0 ${px2}px 3px ${hex}${a2},0 0 ${px3}px 5px ${hex}${a3}`;
  }
  const px1 = (2 + f * 5).toFixed(0);
  const px2 = (6 + f * 14).toFixed(0);
  const a2  = Math.round((0.25 + f * 0.45) * 255).toString(16).padStart(2,'0');
  return `0 0 ${px1}px 1px ${hex},0 0 ${px2}px 2px ${hex}${a2}`;
}

function getGlow(i, throbM) {
  if (level === 0) return 'none';
  // at max level, quantise throb to limit unique strings
  const bucket = level === BASE_LEVEL ? Math.round(throbM * THROB_STEPS) : level;
  const key = i * 100 + bucket;
  let s = glowCache.get(key);
  if (s === undefined) { s = buildGlow(i, bucket / (level === BASE_LEVEL ? THROB_STEPS : 1)); glowCache.set(key, s); }
  return s;
}

// --- DOM ---
const shell        = document.getElementById('shell');
const shellWrapper = document.getElementById('shellWrapper');
const trackA  = document.getElementById('trackA');
const trackB  = document.getElementById('trackB');
const lvlLbl  = document.getElementById('lvlLbl');
const segsA   = [], segsB   = [];

// per-segment committed state (avoid redundant style writes)
const stA = [], stB = []; // {on, glowKey}

function makeSeg() {
  const d = document.createElement('div');
  d.className = 'seg';
  d.style.width  = SEG_W + 'px';
  d.style.height = SEG_H + 'px';
  return d;
}

function buildTrack(track, arr, st) {
  for (let i = 0; i < SEGS; i++) {
    const d = makeSeg();
    d.style.background = OFF_BG[i];
    track.appendChild(d);
    arr.push(d);
    st.push({ on: false, glowKey: -1 });
  }
}

function buildScale() {
  const inner = document.getElementById('scaleInner');
  [-12,-10,-8,-6,-4,-2,0,2,4,6,8,10,12].forEach(v => {
    const sp = document.createElement('span');
    sp.className = 'scale-num';
    sp.textContent = v > 0 ? '+' + v : v;
    inner.appendChild(sp);
  });
}

// --- state ---
let level = 0;
let displayA = 0, displayB = 0;
let idleTargetA = 0, idleTargetB = 0;
let rumblePhase = 0, throbPhase = 0, throbMult = 0;
let overcharge = 0;
let breaking = false, breakFrame = 0;
const BREAK_THRESH = 5, BREAK_TOTAL = 100;

// idle ticker — replaces setInterval with rAF-based accumulator
let lastIdleTime = 0;
const IDLE_INTERVAL = 30; // ms

// rAF handle — null when loop is intentionally paused
let rafId = null;
function startLoop() { if (rafId === null) rafId = requestAnimationFrame(masterLoop); }
function stopLoop()  { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }

let bouncing = false, bounceFrame = 0;
const BOUNCE_TOTAL = 55;
const BREAK_FLASH_END = 58, BREAK_DIE_END = 82;

function forceFullRedraw() {
  for (let i = 0; i < SEGS; i++) {
    stA[i].on = null; stA[i].glowKey = null;
    stB[i].on = null; stB[i].glowKey = null;
  }
}

function setSegDirect(i, bg, glow) {
  segsA[i].style.background = bg;  segsA[i].style.boxShadow = glow;
  segsB[i].style.background = bg;  segsB[i].style.boxShadow = glow;
  stA[i].on = null; stA[i].glowKey = null;
  stB[i].on = null; stB[i].glowKey = null;
}

// Top-N segments strobe red — called after render() each overcharge frame
function applyOverchargeFlash() {
  const oc = overcharge;
  const topN = Math.max(2, Math.ceil(SEGS * (0.12 + oc * 0.10)));
  const strobeProb = 0.38 + oc * 0.13;
  const redGlow = `0 0 ${3 + oc * 2}px 1px #ff1800,0 0 ${8 + oc * 4}px ${oc}px #ff1800bb`;

  for (let i = SEGS - topN; i < SEGS; i++) {
    const segFrac = (i - (SEGS - topN)) / Math.max(1, topN - 1);
    const p = strobeProb * (0.3 + segFrac * 0.7);
    if (Math.random() < p) {
      const white = Math.random() < 0.12 * oc;
      setSegDirect(i,
        white ? '#ffffff' : '#ff1800',
        white ? '0 0 6px 2px #ffffff,0 0 12px 3px #ff1800aa' : redGlow
      );
    } else {
      setSegDirect(i, OFF_BG[i], 'none');
    }
  }
}

// LEDs flash chaotically then die — called instead of render() during break
function applyBreakEffect() {
  const f = breakFrame;

  if (f < BREAK_FLASH_END) {
    // Chaotic random flash — all segments
    const chaos = 0.85 - f / BREAK_FLASH_END * 0.25;
    for (let i = 0; i < SEGS; i++) {
      if (Math.random() < chaos) {
        const white = Math.random() < 0.25;
        setSegDirect(i,
          white ? '#ffffff' : '#ff1800',
          white ? '0 0 5px 2px #ffffff' : '0 0 5px 2px #ff1800'
        );
      } else {
        setSegDirect(i, OFF_BG[i], 'none');
      }
    }
  } else if (f < BREAK_DIE_END) {
    // Dying — survivor probability drops to zero
    const dieT = (f - BREAK_FLASH_END) / (BREAK_DIE_END - BREAK_FLASH_END);
    const prob  = 1 - dieT;
    for (let i = 0; i < SEGS; i++) {
      const on = Math.random() < prob;
      setSegDirect(i, on ? '#ff1800' : OFF_BG[i], on ? '0 0 4px 1px #ff1800' : 'none');
    }
  } else {
    // All dark — just mark dirty so render() cleans up on exit
    if (f === BREAK_DIE_END) {
      for (let i = 0; i < SEGS; i++) setSegDirect(i, OFF_BG[i], 'none');
    }
  }

  breakFrame++;
  if (breakFrame >= BREAK_TOTAL) {
    breaking = false; breakFrame = 0; overcharge = 0;
    throbPhase = 0; throbMult = 0;
    displayA = displayB = 0;
    bouncing = true; bounceFrame = 0;
    forceFullRedraw();
    setLevel(0);
  }
}

// shell transform dirty tracking — avoids redundant style writes every frame
let lastShellTransform = '';

function levelToSegs(lvl) { return Math.round((lvl / BASE_LEVEL) * SEGS); }

function getRumble() {
  if (level === 0) return null;
  if (level <= 2) return { tx:0.15, ty:0.10, rx:0.04, speed:0.025 };
  if (level <= 4) return { tx:0.30, ty:0.20, rx:0.06, speed:0.04  };
  if (level <= 6) return { tx:0.50, ty:0.35, rx:0.10, speed:0.05  };
  if (level <= 8) return { tx:0.80, ty:0.55, rx:0.14, speed:0.075 };
  if (level <= 9) return { tx:1.25, ty:0.88, rx:0.20, speed:0.11  };
                  return { tx:2.00, ty:1.38, rx:0.35, speed:0.20  };
}

// --- render: only write to DOM when value changed ---
function updateTrack(segs, st, vis, throbM) {
  const bucket = level === BASE_LEVEL ? Math.round(throbM * THROB_STEPS) : level;
  for (let i = 0; i < SEGS; i++) {
    const on = i < vis;
    const glowKey = on ? bucket : -1;
    const s = st[i];
    if (s.on === on && s.glowKey === glowKey) continue; // nothing changed
    const el = segs[i];
    if (s.on !== on)       el.style.background  = on ? ON_BG[i] : OFF_BG[i];
    if (s.glowKey !== glowKey) el.style.boxShadow = on ? getGlow(i, throbM) : 'none';
    s.on = on; s.glowKey = glowKey;
  }
}

function render(throbM) {
  updateTrack(segsA, stA, Math.round(displayA), throbM);
  updateTrack(segsB, stB, Math.round(displayB), throbM);
}

// --- master loop (single rAF, no setInterval) ---
let idleTick = 0;
function masterLoop(ts) {
  rafId = null;

  // rumble + bounce
  const p = getRumble();
  let dx = 0, dy = 0, rot = 0;
  if (p) {
    rumblePhase += p.speed;
    dx  = Math.sin(rumblePhase * 7.3)  * p.tx + Math.sin(rumblePhase * 13.1) * p.tx * 0.5;
    dy  = Math.sin(rumblePhase * 9.7)  * p.ty + Math.sin(rumblePhase * 17.3) * p.ty * 0.4;
    rot = Math.sin(rumblePhase * 5.9)  * p.rx;
  }
  if (bouncing) {
    const bt = bounceFrame / BOUNCE_TOTAL;
    dy += Math.sin(bt * Math.PI * 2.8) * Math.pow(1 - bt, 2) * 14;
    bounceFrame++;
    if (bounceFrame >= BOUNCE_TOTAL) bouncing = false;
  }
  if (dx === 0 && dy === 0 && rot === 0 && !bouncing) {
    if (lastShellTransform !== 'none') { shell.style.transform = 'none'; lastShellTransform = 'none'; }
  } else {
    const tr = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg)`;
    if (tr !== lastShellTransform) { shell.style.transform = tr; lastShellTransform = tr; }
  }

  // throb
  if (level === BASE_LEVEL || overcharge > 0 || breaking) {
    const speed = breaking ? 0.18 : (0.065 + overcharge * 0.025);
    throbPhase += speed;
    const fast  = Math.sin(throbPhase * 3.1);
    const slow  = Math.sin(throbPhase * 1.1);
    const spike = Math.pow(Math.max(0, Math.sin(throbPhase * 1.7)), 3) * 0.6;
    const raw   = fast * 0.5 + slow * 0.35 + spike + 0.15;
    const dieMul = breaking ? Math.max(0, 1 - breakFrame / BREAK_TOTAL * 1.5) : 1;
    throbMult = Math.min(1, Math.max(0, raw)) * dieMul;
  }

  // idle drift (rate-limited inside rAF — no setInterval)
  if (ts - lastIdleTime >= IDLE_INTERVAL) {
    lastIdleTime = ts;
    idleTick++;
    if (level === BASE_LEVEL || overcharge > 0 || breaking) {
      displayA = displayB = SEGS;
    } else {
      if (idleTick % 26 === 0) {
        const base   = levelToSegs(level);
        const jitter = level === 0 ? 0 : Math.max(1, Math.round(level * 0.22));
        const flip   = () => (Math.random() < 0.5 ? -1 : 1) * jitter * (Math.random() < 0.65 ? 1 : 0);
        idleTargetA  = Math.max(0, Math.min(SEGS, base + flip()));
        idleTargetB  = Math.max(0, Math.min(SEGS, base + flip()));
      }
      displayA += (idleTargetA - displayA) * 0.2;
      displayB += (idleTargetB - displayB) * 0.2;
    }
  }

  if (breaking) {
    applyBreakEffect();
  } else {
    render(throbMult);
    if (overcharge > 0) applyOverchargeFlash();
  }
  if (level > 0 || Math.round(displayA) > 0 || Math.round(displayB) > 0 || overcharge > 0 || breaking || bouncing) rafId = requestAnimationFrame(masterLoop);
}

function setLevel(v) {
  level = Math.max(0, Math.min(BASE_LEVEL, v));
  lvlLbl.textContent = level + ' / ' + BASE_LEVEL;
  glowCache.clear();
  if (level === BASE_LEVEL) {
    idleTargetA = idleTargetB = displayA = displayB = SEGS;
  } else {
    idleTargetA = idleTargetB = levelToSegs(level);
    throbPhase = 0; throbMult = 0;
  }
  if (level === 0) {
    if (lastShellTransform !== 'none') { shell.style.transform = 'none'; lastShellTransform = 'none'; }
  }
  render(0);
  startLoop();
}

function pressPlus() {
  if (breaking) return;
  if (level < BASE_LEVEL) { setLevel(level + 1); return; }
  overcharge++;
  if (overcharge >= BREAK_THRESH) { breaking = true; breakFrame = 0; }
  startLoop();
}
function pressMinus() {
  if (breaking) return;
  if (overcharge > 0) {
    overcharge--;
    if (overcharge === 0) forceFullRedraw();
    startLoop(); return;
  }
  setLevel(level - 1);
}
function pressClear() {
  breaking = false; breakFrame = 0; overcharge = 0;
  bouncing = false; bounceFrame = 0;
  forceFullRedraw();
  setLevel(0);
}

document.getElementById('btnAdd').addEventListener('click',   pressPlus);
document.getElementById('btnLess').addEventListener('click',  pressMinus);
document.getElementById('btnClear').addEventListener('click', pressClear);

// --- slide in / out ---
const SLIDE_OFF = 540; // px right of natural position
let overlayVisible = false;
let hideTimer = null;

function showOverlay() {
  clearTimeout(hideTimer);
  overlayVisible = true;
  shellWrapper.style.willChange = 'transform';
  shellWrapper.style.transition = 'transform 0.5s cubic-bezier(0.22,1,0.36,1)';
  shellWrapper.style.transform  = 'translateX(0)';
  setTimeout(() => { shellWrapper.style.willChange = 'auto'; }, 520);
}

function hideOverlay() {
  if (!overlayVisible) return;
  overlayVisible = false;
  shellWrapper.style.willChange = 'transform';
  shellWrapper.style.transition = 'transform 0.38s cubic-bezier(0.55,0,1,0.45)';
  shellWrapper.style.transform  = `translateX(${SLIDE_OFF}px)`;
  hideTimer = setTimeout(() => { shellWrapper.style.willChange = 'auto'; pressClear(); }, 420);
}

document.getElementById('btnShow').addEventListener('click', showOverlay);
document.getElementById('btnHide').addEventListener('click', hideOverlay);

buildScale();
buildTrack(trackA, segsA, stA);
buildTrack(trackB, segsB, stB);
setLevel(0);

// --- SSE remote control ---
const DEFAULT_SERVER = window.location.host;
const sseDot         = document.getElementById('sseDot');
let sseSource        = null;
let sseRetryTimer    = null;

function setSseStatus(s) { sseDot.className = 'sse-dot ' + s; }

function connectSSE(host) {
  clearTimeout(sseRetryTimer);
  if (sseSource) { sseSource.close(); sseSource = null; }
  setSseStatus('connecting');
  try {
    sseSource = new EventSource('http://' + host + '/overlay/events');
    sseSource.onopen  = () => setSseStatus('connected');
    sseSource.addEventListener('meter', (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.cmd === 'plus')  pressPlus();
        if (d.cmd === 'minus') pressMinus();
        if (d.cmd === 'clear') pressClear();
        if (d.cmd === 'show')  showOverlay();
        if (d.cmd === 'hide')  hideOverlay();
      } catch {}
    });
    sseSource.addEventListener('debugoff', () => {
      const bar = document.querySelector('.server-cfg');
      if (bar) bar.style.display = 'none';
    });
    sseSource.onerror = () => {
      setSseStatus('disconnected');
      sseSource.close(); sseSource = null;
      sseRetryTimer = setTimeout(() => connectSSE(DEFAULT_SERVER), 4000);
    };
  } catch { setSseStatus('disconnected'); }
}

connectSSE(DEFAULT_SERVER);
</script>
