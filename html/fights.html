<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="js/cache-bust.js"></script>
<title>Fight Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: transparent;
  font-family: 'General Sans', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

body.debug-mode {
  padding: 40px;
  min-height: 100vh;
}

/* ── OVERLAY ─────────────────────────────────────────────────────────── */
#overlay {
  width: 905px;
  height: 286px;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  will-change: transform, opacity;
}


#overlay.in {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  animation: overlayIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}

#overlay.out {
  pointer-events: none;
  visibility: visible;
  opacity: 1;
  animation: overlayOut 0.35s cubic-bezier(0.55, 0, 1, 0.45) both;
}

/* ── KEYFRAMES ───────────────────────────────────────────────────────── */
@keyframes overlayIn {
  from { transform: translateY(60px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

@keyframes overlayOut {
  from { transform: translateY(0);    opacity: 1; }
  to   { transform: translateY(60px); opacity: 0; }
}

/* Header slides in from left */
@keyframes headerIn {
  from { transform: translateX(-20px); opacity: 0; }
  to   { transform: translateX(0);     opacity: 1; }
}

/* Awards bar fades up */
@keyframes fadeUp {
  from { transform: translateY(8px); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}

/* Player rows fade in */
@keyframes rowFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* Damage bars scale in from left edge */
@keyframes barFill {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}

/* Stagger child elements on enter */
#overlay.in .header {
  animation: headerIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
}
#overlay.in .awards-bar {
  animation: fadeUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) 0.16s both;
}


#overlay.in .camp-col .player-row:nth-child(1) { animation: rowFadeIn 0.35s ease 0.20s backwards; }
#overlay.in .camp-col .player-row:nth-child(2) { animation: rowFadeIn 0.35s ease 0.26s backwards; }
#overlay.in .camp-col .player-row:nth-child(3) { animation: rowFadeIn 0.35s ease 0.32s backwards; }
#overlay.in .camp-col .player-row:nth-child(4) { animation: rowFadeIn 0.35s ease 0.38s backwards; }
#overlay.in .camp-col .player-row:nth-child(5) { animation: rowFadeIn 0.35s ease 0.44s backwards; }

#overlay.in .dmg-bar-fill {
  animation: barFill 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.52s both;
}

/* ── HEADER ──────────────────────────────────────────────────────────── */
.header {
  height: 40px;
  background: linear-gradient(to bottom, #aca9aa 0%, #f5f5f5 20%, #f5f5f5 80%, #aca9aa 100%);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 0;
  flex-shrink: 0;
}

.fight-label {
  font-size: 13.6px;
  font-weight: 700;
  letter-spacing: 2.5px;
  color: #0f172a;
  text-transform: uppercase;
  margin-right: 10px;
  flex-shrink: 0;
}

.fight-number {
  font-family: 'Anton', sans-serif;
  font-size: 17px;
  color: #0f172a;
  margin-right: 12px;
  flex-shrink: 0;
}

.header-sep {
  width: 1px;
  height: 16px;
  background: #aca9aa;
  margin: 0 12px;
  flex-shrink: 0;
}

.fight-time {
  font-family: 'Anton', sans-serif;
  font-size: 17px;
  color: #0f172a;
  flex-shrink: 0;
}

.fight-duration {
  font-size: 10.8px;
  font-weight: 500;
  color: #0f172a;
  text-transform: uppercase;
  margin-left: 6px;
  flex-shrink: 0;
}

.header-score {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.team-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #64748b;
  flex-shrink: 0;
}

.score-num {
  font-family: 'Anton', sans-serif;
  font-size: 30px;
  line-height: 1;
  flex-shrink: 0;
}

.score-num.c1 { color: #60a5fa; }
.score-num.c2 { color: #f87171; }

.score-colon {
  font-family: 'Anton', sans-serif;
  font-size: 20px;
  color: #334155;
  flex-shrink: 0;
}

.winner-badge {
  padding: 3px 8px;
  border-radius: 3px;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  flex-shrink: 0;
}

.winner-badge.c1   { background: #1d4ed8; color: #fff; }
.winner-badge.c2   { background: #b91c1c; color: #fff; }
.winner-badge.draw { background: #334155; color: #94a3b8; }

/* ── AWARDS BAR ──────────────────────────────────────────────────────── */
.awards-bar {
  height: 30px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  padding: 0 14px;
  flex-shrink: 0;
  gap: 0;
}

.gold-block {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: 1;
}

.gold-block.c2 { justify-content: flex-end; }

.gold-amount {
  font-family: 'Anton', sans-serif;
  font-size: 19.5px;
  color: #0f172a;
  white-space: nowrap;
}

.gold-label {
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #94a3b8;
  white-space: nowrap;
}

.gold-sep {
  font-family: 'Anton', sans-serif;
  font-size: 13px;
  color: #cbd5e1;
  flex-shrink: 0;
  padding: 0 10px;
}

/* ── PLAYERS AREA ────────────────────────────────────────────────────── */
.players-area {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

.camp-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.camp-divider {
  width: 5px;
  background: #e2e8f0;
  flex-shrink: 0;
}

/* ── PLAYER ROW ──────────────────────────────────────────────────────── */
.player-row {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 7px;
  border-bottom: 1px solid #f1f5f9;
  min-height: 0;
  overflow: hidden;
}

.player-row:last-child { border-bottom: none; }
.player-row.dead { }

.camp-col.c2 .player-row { flex-direction: row-reverse; }

.hero-img {
  width: 34px;
  height: 34px;
  object-fit: cover;
  border-radius: 3px;
  flex-shrink: 0;
  display: block;
}

.hero-placeholder {
  width: 34px;
  height: 34px;
  border-radius: 3px;
  background: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #94a3b8;
  flex-shrink: 0;
}

.player-row.dead .hero-img,
.player-row.dead .hero-placeholder {
  filter: grayscale(1) brightness(0.75);
}

.p-name {
  font-size: 15px;
  font-weight: 600;
  color: #1e293b;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
}

.camp-col.c2 .p-name { text-align: right; }


.kill-badge {
  display: flex;
  align-items: center;
  gap: 2px;
  color: #f59e0b;
  flex-shrink: 0;
}

.kill-badge .kill-count {
  font-family: 'Anton', sans-serif;
  font-size: 12px;
  color: #f59e0b;
  line-height: 1;
}

.badges {
  width: 90px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.cc-badge {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

.cc-badge .cc-count {
  font-family: 'Anton', sans-serif;
  font-size: 12px;
  color: #7c3aed;
  line-height: 1;
  white-space: nowrap;
}

.dmg-area {
  width: 205px;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.camp-col.c2 .dmg-area { flex-direction: row-reverse; }

.dmg-bar-bg {
  flex: 1;
  height: 12.5px;
  background: #e2e8f0;
  overflow: hidden;
}

.camp-col.c2 .dmg-bar-bg {
  display: flex;
  justify-content: flex-end;
}

.dmg-bar-fill {
  height: 100%;
  transform-origin: left center;
}

.camp-col.c1 .dmg-bar-fill { background: #3b82f6; }
.camp-col.c2 .dmg-bar-fill { background: #ef4444; transform-origin: right center; }

.dmg-num {
  font-family: 'Anton', sans-serif;
  font-size: 19.5px;
  color: #1e293b;
  white-space: nowrap;
  width: 42px;
  text-align: right;
  flex-shrink: 0;
}

.camp-col.c2 .dmg-num { text-align: left; }

.dmg-pct {
  font-family: 'Anton', sans-serif;
  font-size: 11px;
  color: #94a3b8;
  white-space: nowrap;
  width: 30px;
  text-align: right;
  flex-shrink: 0;
}

.camp-col.c2 .dmg-pct { text-align: left; }

/* ── DEBUG PANEL ─────────────────────────────────────────────────────── */
#debug-panel {
  margin-top: 14px;
  width: 905px;
  background: rgba(15, 23, 42, 0.95);
  border: 1px solid #1e293b;
  border-radius: 8px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dbg-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.dbg-sep {
  width: 1px;
  height: 22px;
  background: #1e293b;
  flex-shrink: 0;
}

.dbg-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #475569;
  flex-shrink: 0;
}

#debug-status {
  font-size: 11px;
  color: #64748b;
  margin-left: auto;
  white-space: nowrap;
}

/* mode toggle */
.mode-group {
  display: flex;
  border: 1px solid #334155;
  border-radius: 5px;
  overflow: hidden;
  flex-shrink: 0;
}

.btn-mode {
  padding: 5px 14px;
  border: none;
  font-family: 'General Sans', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  background: transparent;
  color: #475569;
  transition: background 0.15s, color 0.15s;
}

.btn-mode.active-debug { background: #f59e0b; color: #0f172a; }
.btn-mode.active-live  { background: #22c55e; color: #0f172a; }

/* anim buttons */
#debug-panel button.btn-play { background: #3b82f6; color: #fff; }
#debug-panel button.btn-hide { background: #ef4444; color: #fff; }
#debug-panel button.btn-nav  { background: #1e293b; color: #94a3b8; }

#debug-panel button {
  padding: 5px 13px;
  border: none;
  border-radius: 4px;
  font-family: 'General Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
}

#api-input {
  flex: 1;
  min-width: 180px;
  padding: 5px 10px;
  border: 1px solid #334155;
  border-radius: 4px;
  background: #1e293b;
  color: #f1f5f9;
  font-size: 12px;
  font-family: monospace;
  outline: none;
}

#api-input:focus { border-color: #3b82f6; }
.btn-apply { background: #1d4ed8 !important; color: #fff !important; }
</style>
</head>
<body>

<div id="overlay">

  <!-- HEADER -->
  <div class="header">
    <div class="fight-label">Fight Recap</div>
    <div class="header-sep"></div>
    <div class="fight-time" id="fight-time">—:—</div>
    <div class="fight-duration" id="fight-dur"></div>
  </div>

  <!-- AWARDS BAR -->
  <div class="awards-bar">
    <div class="gold-block c1">
      <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <circle cx="8" cy="8" r="7.5" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
        <circle cx="8" cy="8" r="5.2" fill="none" stroke="#fde68a" stroke-width="1.2"/>
      </svg>
      <span class="gold-amount" id="c1-gold">—</span>
      <span class="gold-label">Gold Earned</span>
    </div>
    <div class="gold-sep">+</div>
    <div class="gold-block c2">
      <span class="gold-label">Gold Earned</span>
      <span class="gold-amount" id="c2-gold">—</span>
      <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <circle cx="8" cy="8" r="7.5" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
        <circle cx="8" cy="8" r="5.2" fill="none" stroke="#fde68a" stroke-width="1.2"/>
      </svg>
    </div>
  </div>

  <!-- PLAYERS -->
  <div class="players-area">
    <div class="camp-col c1" id="camp1"></div>
    <div class="camp-divider"></div>
    <div class="camp-col c2" id="camp2"></div>
  </div>

</div>

<!-- DEBUG PANEL -->
<div id="debug-panel">
  <!-- Row 1: mode + animation + nav -->
  <div class="dbg-row">
    <div class="dbg-label">Mode</div>
    <div class="mode-group">
      <button class="btn-mode" id="btn-debug-mode" onclick="setMode('debug')">Debug</button>
      <button class="btn-mode" id="btn-live-mode"  onclick="setMode('live')">Live</button>
    </div>
    <div class="dbg-sep"></div>
    <div class="dbg-label">Animation</div>
    <button class="btn-play" onclick="debugIn()">▶ Play</button>
    <button class="btn-hide" onclick="debugOut()">■ Hide</button>
    <div class="dbg-sep"></div>
    <div class="dbg-label">Fight</div>
    <button class="btn-nav" onclick="debugPrev()">← Prev</button>
    <button class="btn-nav" onclick="debugNext()">Next →</button>
    <div id="debug-status">—</div>
  </div>
  <!-- Row 2: connected server -->
  <div class="dbg-row" id="url-row">
    <div class="dbg-label">Server</div>
    <span id="api-input" style="font-family:monospace;font-size:12px;color:#94a3b8;"></span>
  </div>
</div>

<script>
const qs      = new URLSearchParams(window.location.search);
let   baseUrl = (qs.get('api') || window.location.origin).replace(/\/$/, '');

const POLL_MS = 2000;

let mode      = 'live';
let allFights = [];
let debugIdx  = -1;
let pollTimer = null;
let feedData  = null;

const overlay = document.getElementById('overlay');

document.body.classList.add('debug-mode');
document.getElementById('api-input').textContent = baseUrl;

// ── MODE ──────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('btn-debug-mode').className =
    'btn-mode' + (m === 'debug' ? ' active-debug' : '');
  document.getElementById('btn-live-mode').className =
    'btn-mode' + (m === 'live' ? ' active-live' : '');
  document.getElementById('url-row').style.display = m === 'live' ? 'flex' : 'none';

  clearInterval(pollTimer);
  allFights = [];
  debugIdx  = -1;

  if (m === 'debug') {
    loadStatic();
  } else {
    poll();
    pollTimer = setInterval(poll, POLL_MS);
  }
}

// ── ANIMATIONS ────────────────────────────────────────────────────────
function animateIn() {
  overlay.classList.remove('out', 'hidden');
  overlay.style.opacity    = '';
  overlay.style.visibility = '';
  void overlay.offsetWidth;
  overlay.classList.add('in');
}

function animateOut() {
  overlay.classList.remove('in');
  overlay.classList.add('out');
  overlay.addEventListener('animationend', () => {
    overlay.classList.remove('out');
    overlay.style.opacity  = '0';
    overlay.style.visibility = 'hidden';
  }, { once: true });
}

// ── HELPERS ───────────────────────────────────────────────────────────
function fmtDmg(n) {
  if (!n) return '0';
  return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
}

function fmtDur(s) {
  if (s < 60) return `${s}s`;
  return `${Math.floor(s / 60)}m ${s % 60}s`;
}

function ccBadge(control_s) {
  if (!control_s || control_s < 3) return '';
  const svg = `<svg width="18" height="18" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <circle cx="10" cy="10" r="10" fill="#7c3aed"/>
    <circle cx="10" cy="10" r="5.5" fill="none" stroke="#fff" stroke-width="1.3"/>
    <line x1="10" y1="10" x2="10" y2="6.2" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="10" y1="10" x2="12.8" y2="10" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  </svg>`;
  return `<div class="cc-badge">${svg}<span class="cc-count">${Math.round(control_s)}s CC</span></div>`;
}

function killBadge(kills) {
  if (!kills || kills <= 0) return '';
  const svg = `<svg width="18" height="18" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <circle cx="10" cy="10" r="10" fill="#000"/>
    <g transform="rotate(45 10 10)" fill="#fff">
      <polygon points="10,2 11,6 10.5,12 9.5,12 9,6"/>
      <rect x="6.5" y="12" width="7" height="1.5" rx="0.5"/>
      <rect x="9.25" y="13.5" width="1.5" height="3" rx="0.5"/>
      <rect x="8.5" y="16.5" width="3" height="1.5" rx="0.75"/>
    </g>
  </svg>`;
  const count = kills > 1 ? `<span class="kill-count">x${kills}</span>` : '';
  return `<div class="kill-badge">${svg}${count}</div>`;
}


// canvas text measurer — column 450px minus: padding 24, hero 34, gaps 21, badges 90, dmg 205
const _mc = document.createElement('canvas').getContext('2d');
const NAME_MAX_W = 76;

function calcNameSize(name) {
  _mc.font = `600 15px 'General Sans', system-ui, sans-serif`;
  const w = _mc.measureText(name).width;
  if (w <= NAME_MAX_W) return 15;
  return Math.max(7, Math.floor(15 * NAME_MAX_W / w));
}

function setStatus(msg) {
  const el = document.getElementById('debug-status');
  if (el) el.textContent = msg;
}

// ── RENDER ────────────────────────────────────────────────────────────
function render(fight, feed) {
  const s = fight.summary;

  document.getElementById('fight-time').textContent = fight.start_time_fmt;
  document.getElementById('fight-dur').textContent  = fmtDur(fight.duration_s) + ' Fight Duration';
  const t1 = feed?.camp1?.tricode || 'BLUE';
  const t2 = feed?.camp2?.tricode || 'RED';

  const c1 = fight.players.filter(p => p.camp === 1).sort((a, b) => a.seat - b.seat);
  const c2 = fight.players.filter(p => p.camp === 2).sort((a, b) => a.seat - b.seat);
  const maxDmg = Math.max(1, ...fight.players.map(p => p.dmg_dealt));

  function rowHTML(p) {
    const bar      = Math.round((p.dmg_dealt / maxDmg) * 100);
    const imgUrl   = heroImgUrl(p.hero_id);
    const heroEl   = imgUrl
      ? `<img class="hero-img" src="${imgUrl}" alt="${p.hero || ''}">`
      : `<div class="hero-placeholder">${(p.hero || '?').charAt(0)}</div>`;
    const name     = p.name || '—';
    const fontSize = calcNameSize(name);
    return `<div class="player-row${p.survived ? '' : ' dead'}">
      ${heroEl}
      <div class="p-name" style="font-size:${fontSize}px">${name}</div>
      <div class="badges">${ccBadge(p.control_s)}${killBadge(p.kills)}</div>
      <div class="dmg-area">
        <div class="dmg-bar-bg"><div class="dmg-bar-fill" style="width:${bar}%"></div></div>
        <div class="dmg-num">${fmtDmg(p.dmg_dealt)}</div>
        <div class="dmg-pct">${p.dmg_share}%</div>
      </div>
    </div>`;
  }

  document.getElementById('camp1').innerHTML = c1.map(rowHTML).join('');
  document.getElementById('camp2').innerHTML = c2.map(rowHTML).join('');

  const c1gold = c1.reduce((sum, p) => sum + (p.gold_earned || 0), 0);
  const c2gold = c2.reduce((sum, p) => sum + (p.gold_earned || 0), 0);
  document.getElementById('c1-gold').textContent = c1gold.toLocaleString();
  document.getElementById('c2-gold').textContent = c2gold.toLocaleString();
}

function heroImgUrl(id) {
  if (!id) return null;
  return `${baseUrl}/hero/HERO_${id}_KOTAK.png`;
}

// ── SSE: listen for show/hide triggers ───────────────────────────────
function connectSSE() {
  const es = new EventSource(`${baseUrl}/overlay/events`);
  es.addEventListener('debugoff', () => {
    const p = document.getElementById('debug-panel');
    if (p) p.style.display = 'none';
  });
  es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
}
connectSSE();

// ── ACTION POLL — picks up show/hide from server every 500ms ─────────
let lastActionTs = 0;
async function pollAction() {
  try {
    const r = await fetch(`${baseUrl}/overlay/fights/pending`);
    const { action, ts } = await r.json();
    if (action && ts && ts !== lastActionTs) {
      lastActionTs = ts;
      if (action === 'show') {
        if (allFights.length) { debugIdx = allFights.length - 1; render(allFights[debugIdx], feedData); }
        animateIn();
      } else if (action === 'hide') {
        animateOut();
      }
    }
  } catch {}
}
setInterval(pollAction, 500);
pollAction();

// ── DEBUG MODE: load fights.json static data ─────────────────────────
async function loadStatic() {
  try {
    setStatus('Loading fights.json…');
    const res  = await fetch(`${baseUrl}/fights-static`);
    const data = await res.json();
    if (data.error) { setStatus('Error: ' + data.error); return; }
    allFights = data.fights || [];
    if (!allFights.length) { setStatus('No fights in fights.json'); return; }
    debugIdx = allFights.length - 1;
    render(allFights[debugIdx], null);
    setStatus(`[DEBUG] Fight #${allFights[debugIdx].id} · ${debugIdx + 1}/${allFights.length} from fights.json`);
  } catch (e) {
    setStatus('Static load error: ' + e.message);
  }
}

// ── LIVE MODE: poll API for latest data (no auto-show) ────────────────
async function poll() {
  try {
    const [fightRes, feedRes] = await Promise.all([
      fetch(`${baseUrl}/fights?all=1`),
      fetch(`${baseUrl}/feed/order`).catch(() => null),
    ]);
    const fightData = await fightRes.json();
    feedData  = feedRes ? await feedRes.json().catch(() => null) : null;
    allFights = fightData.fights || [];

    if (allFights.length) {
      debugIdx = allFights.length - 1;
      setStatus(`[LIVE] Fight #${allFights[debugIdx].id} · ${allFights.length} recorded — waiting for trigger`);
    } else {
      setStatus('[LIVE] No fights yet');
    }
  } catch (e) {
    setStatus('[LIVE] Error: ' + e.message);
  }
}

setMode('live');

// ── DEBUG CONTROLS ────────────────────────────────────────────────────
function debugIn() {
  if (allFights.length && debugIdx >= 0) render(allFights[debugIdx], feedData);
  animateIn();
}

function debugOut() {
  animateOut();
}

function debugPrev() {
  if (!allFights.length) return;
  debugIdx = Math.max(0, debugIdx - 1);
  render(allFights[debugIdx], feedData);
  const src = mode === 'debug' ? 'fights.json' : 'live';
  setStatus(`[${mode.toUpperCase()}] Fight #${allFights[debugIdx].id} · ${debugIdx + 1}/${allFights.length} · ${src}`);
}

function debugNext() {
  if (!allFights.length) return;
  debugIdx = Math.min(allFights.length - 1, debugIdx + 1);
  render(allFights[debugIdx], feedData);
  const src = mode === 'debug' ? 'fights.json' : 'live';
  setStatus(`[${mode.toUpperCase()}] Fight #${allFights[debugIdx].id} · ${debugIdx + 1}/${allFights.length} · ${src}`);
}

function applyUrl() {
  allFights = [];
  debugIdx  = -1;
  clearInterval(pollTimer);
  connectSSE();
  poll();
  pollTimer = setInterval(poll, POLL_MS);
}
</script>

</body>
