    <img id="pp-fc27" class="rb-fc27" style="left:1600px;top:390px;width:180px;height:40px"><img id="pp-ps" class="rb-ps" style="left:1610px;top:462px;width:150px;height:45px">
  </div>
  <!-- 109 L-BRACKET -->
  <div id="lbk-page" class="rb-page">
    <img id="lbk-logo" class="rb-logo">
    <div id="lbk-feed" class="rb-feed"></div>
    <div id="lbk-name-1" class="rb-plate rb-navy sl-r rb-name rb-slide-l" data-fit="40,18"></div>
    <div id="lbk-vs" class="rb-plate rb-silver sl-both rb-pop" style="--d:.2s">VS</div>
    <div id="lbk-name-2" class="rb-plate rb-navy sl-r rb-name rb-slide-l" style="--d:.1s" data-fit="40,18"></div>
    <img id="lbk-fc27" class="rb-fc27"><img id="lbk-ps" class="rb-ps">
  </div>

  <!-- 401 WIPE -->
  <div id="rb-wipe">
    <div id="wp-tex"></div><div id="wp-shade"></div>
    <div id="wp-edge"></div>
    <div id="wp-beam-l" class="wp-beam"></div><div id="wp-beam-r" class="wp-beam"></div>
    <img id="wp-logo" class="rb-logo" style="filter:drop-shadow(0 10px 40px rgba(0,0,0,.6))">
  </div>
</div>

<script src="/html/js/overlay-sse-shim.js"></script>
<script src="/html/redbull/rb-core.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var bg = $('rb-bg');
  var active = null;          // currently shown scene key
  var holeTimer = null;
  var HIDE_MS = 420;

  function flagImg(pl) { return pl.flag ? '<img class="rb-flag" src="' + pl.flag + '">' : ''; }

  /* ───────── scene content ───────── */
  function applyCountdown(s) {
    $('cd-label').textContent = s.countdown.label || '';
    tickCountdown();
  }
  function tickCountdown() {
    if (!RB.state) return;
    $('cd-time').innerHTML = RB.fmtTime(RB.timerRemaining()).replace(/:/g, '<i class="cl">:</i>');
  }
  function applyHolding(s) { $('hp-title').textContent = s.holding.title || ''; $('hp-sub').textContent = s.holding.sub || ''; }
  function applySchedule(s) {
    $('sc-title').textContent = s.schedule.title || ''; $('sc-sub').textContent = s.schedule.sub || '';
    $('sc-rows').innerHTML = s.schedule.rows.slice(0, 8).map(function (r, i) {
      var a = RB.player(r.a), b = RB.player(r.b);
      return '<div class="sc-row rb-pop" style="top:' + (i * 66.6) + 'px;--d:' + (0.2 + i * 0.06) + 's">' +
        '<div class="sc-num rb-silver">' + (i + 1) + '</div>' +
        '<div class="sc-pl rb-name">' + flagImg(a) + '<span data-fit="38,18" class="fit-inline">' + RB.esc(a.last) + '</span></div>' +
        '<div class="sc-vs">VS</div>' +
        '<div class="sc-pr rb-name">' + flagImg(b) + '<span data-fit="38,18" class="fit-inline">' + RB.esc(b.last) + '</span></div>' +
        '<div class="sc-time">' + RB.esc(r.time || '') + '</div></div>';
    }).join('');
  }
  function bar(pl, side) {
    var ctry = '<div class="rb-plate rb-deep ctry ' + (side === 'l' ? 'sl-r' : 'sl-l') + '" style="--sl:26px">' + flagImg(pl) + '<span>' + RB.esc(pl.code) + '</span></div>';
    var nm = '<div class="rb-plate rb-navy nm rb-name ' + (side === 'l' ? 'sl-r' : 'sl-l') + '" style="--sl:26px" data-fit="44,22">' + RB.nameHTML(pl) + '</div>';
    return side === 'l' ? ctry + nm : nm + ctry;
  }
  function applyMatchId(s) {
    var a = RB.player(s.match.p1), b = RB.player(s.match.p2);
    $('mi-photo-l').src = a.photo; $('mi-photo-r').src = b.photo;
    $('mi-bar-l').innerHTML = bar(a, 'l'); $('mi-bar-r').innerHTML = bar(b, 'r');
  }
  function chip(pl) { return flagImg(pl) + '<span>' + RB.esc(pl.code) + '</span>'; }
  function applyResults(s) {
    var a = RB.player(s.match.p1), b = RB.player(s.match.p2);
    $('mr-photo-l').src = a.photo; $('mr-photo-r').src = b.photo;
    $('mr-name-l').innerHTML = RB.nameHTML(a); $('mr-name-r').innerHTML = RB.nameHTML(b);
    function z(n) { n = Number(n) || 0; return (n < 10 ? '0' : '') + n; }
    $('mr-score').textContent = z(s.match.score1) + ' - ' + z(s.match.score2);
    $('mr-chip-l').innerHTML = chip(a); $('mr-chip-r').innerHTML = chip(b);
  }

  // Player grid cell (Top 16 / 8 / 4)
  function cell(pl, x, y, v, delay) {
    var st = 'left:' + x + 'px;top:' + y + 'px;--d:' + delay + 's;' + Object.keys(v).map(function (k) { return '--' + k + ':' + v[k]; }).join(';');
    return '<div class="pc rb-pop" style="' + st + '"><img class="rb-photo" src="' + pl.photo + '">' +
      '<div class="rb-plate rb-navy sl-both pc-name rb-name" data-fit="' + parseFloat(v.fs) + ',12">' + RB.nameHTML(pl) + '</div>' +
      '<div class="rb-chip pc-chip">' + flagImg(pl) + '<span>' + RB.esc(pl.code) + '</span></div></div>';
  }
  function applyTop16(s) {
    var ids = s.top16, h = '';
    var V = { cw: '246px', ch: '250px', pw: '170px', ph: '160px', nw: '216px', nh: '40px', nt: '160px', ct: '204px', chw: '84px', chh: '28px', fs: '24px', cfs: '18px' };
    var rows = [[584, 830, 1076, 1326], [344, 590, 836, 1080, 1326, 1574], [344, 590, 836, 1080, 1326, 1574]];
    var tops = [140, 430, 740], n = 0;
    rows.forEach(function (xs, r) { xs.forEach(function (cx) { h += cell(RB.player(ids[n]), cx - 123, tops[r], V, 0.1 + n * 0.04); n++; }); });
    $('t16-grid').innerHTML = h;
  }
  function applyTop8(s) {
    var ids = s.top8, h = '';
    var V = { cw: '300px', ch: '330px', pw: '200px', ph: '190px', nw: '270px', nh: '52px', nt: '184px', ct: '246px', chw: '100px', chh: '34px', fs: '30px', cfs: '22px' };
    var xs = [424, 788, 1148, 1508], tops = [300, 586];
    for (var n = 0; n < 8; n++) h += cell(RB.player(ids[n]), xs[n % 4] - 150, tops[Math.floor(n / 4)], V, 0.1 + n * 0.05);
    $('t8-grid').innerHTML = h;
  }
  function applyTop4(s) {
    var ids = s.top4, h = '';
    var V = { cw: '420px', ch: '420px', pw: '290px', ph: '270px', nw: '380px', nh: '72px', nt: '270px', ct: '348px', chw: '120px', chh: '38px', fs: '40px', cfs: '24px' };
    var xs = [364, 760, 1156, 1550];
    for (var n = 0; n < 4; n++) h += cell(RB.player(ids[n]), xs[n] - 210, 380, V, 0.1 + n * 0.07);
    $('t4-grid').innerHTML = h;
  }

  // Bracket geometry — 32-slot template (left half = r32[0..15], right half = r32[16..31]).
  var COLS = [{ x: 140, w: 100 }, { x: 296, w: 112 }, { x: 462, w: 100 }, { x: 630, w: 100 }, { x: 812, w: 116 }];
  function applyBracket(s) {
    var br = s.bracket, html = '', paths = '';
    var rounds = [br.r32, br.r16, br.r8, br.r4, br.f];
    function ys(col, half) {            // y centres of every box in a column of one half
      var n = [16, 8, 4, 2, 1][col], out = [];
      for (var i = 0; i < n; i++) {
        if (col === 0) out.push(196 + 110 * Math.floor(i / 2) + (i % 2 ? 22 : -22));
        else if (col === 1) out.push(196 + 110 * i);
        else { var p = ys(col - 1, half); out.push((p[2 * i] + p[2 * i + 1]) / 2); }
      }
      return out;
    }
    function boxX(col, half) { var c = COLS[col]; return half === 0 ? c.x : 1920 - c.x - c.w; }
    [0, 1].forEach(function (half) {
      for (var col = 0; col < 5; col++) {
        var Y = ys(col, half), n = Y.length, c = COLS[col];
        for (var i = 0; i < n; i++) {
          var slotIdx = (col === 4) ? half : (half * n + i);
          var pl = RB.player(rounds[col][slotIdx]);
          var cls = 'bx rb-pop' + (half ? ' rt' : '');
          html += '<div class="' + cls + '" style="left:' + boxX(col, half) + 'px;top:' + (Y[i] - 20) + 'px;width:' + c.w + 'px;--d:' + (0.05 + col * 0.12) + 's">' +
            (pl.empty ? '<span class="bl" style="opacity:.6">TBD</span>' :
              '<span class="bf" data-fit="15,8">' + RB.esc(pl.first) + '</span><span class="bl" data-fit="21,10">' + RB.esc(pl.last) + '</span>') + '</div>';
        }
        if (col > 0) {                    // connectors from previous column into this one
          var P = ys(col - 1, half);
          for (var j = 0; j < n; j++) {
            var cp = COLS[col - 1];
            var xr = half === 0 ? cp.x + cp.w : 1920 - cp.x - cp.w;           // child's inner edge
            var xpar = half === 0 ? c.x : (1920 - c.x);                         // parent's inner edge
            var xmid = (xr + xpar) / 2, y1 = P[2 * j], y2 = P[2 * j + 1], ym = Y[j];
            paths += '<path d="M' + xr + ' ' + y1 + 'H' + xmid + 'V' + y2 + 'H' + xr + 'M' + xmid + ' ' + ym + 'H' + xpar + '"/>';
          }
        }
      }
    });
    $('br-boxes').innerHTML = '<svg id="br-lines" viewBox="0 0 1920 1080">' + paths + '</svg>' + html;
  }

  function lbRows(list, host) {
    $(host).innerHTML = list.map(function (r, i) {
      var pl = RB.player(r.p);
      var rank = (host === 'lb-rowsA' ? 1 : 5) + i;
      return '<div class="lb-row rb-pop" style="top:' + (i * 67) + 'px;--d:' + (0.15 + i * 0.07) + 's">' +
        '<div class="lb-rank">' + rank + '</div>' +
        '<div class="lb-name">' + flagImg(pl) + '<span data-fit="38,18" class="fit-inline">' + RB.esc(RB.initialName(pl)) + '</span></div>' +
        ['gp', 'w', 'l', 'd', 'gd'].map(function (k, n) { return '<div class="lb-stat" style="left:' + (496 + n * 71) + 'px">' + RB.esc(r[k]) + '</div>'; }).join('') + '</div>';
    }).join('');
  }
  function applyLeaderboard(s) {
    $('lb-title').textContent = s.leaderboard.title || ''; $('lb-sub').textContent = s.leaderboard.sub || '';
    lbRows(s.leaderboard.groupA, 'lb-rowsA'); lbRows(s.leaderboard.groupB, 'lb-rowsB');
  }
  function applyWinner(s) {
    var pl = RB.player(s.winner.p);
    $('wn-photo').src = pl.photo; $('wn-name').innerHTML = RB.nameHTML(pl); $('wn-sub').textContent = s.winner.sub || '';
  }
  function applySplit2(s) { $('s2-title-l').textContent = s.layouts.split2[0] || ''; $('s2-title-r').textContent = s.layouts.split2[1] || ''; }
  function applySplit3(s) { var t = s.layouts.split3; $('s3-title-t').textContent = t[0] || ''; $('s3-title-l').textContent = t[1] || ''; $('s3-title-r').textContent = t[2] || ''; }
  function applyPip(s) { $('pp-title').textContent = s.layouts.pip || ''; }
  function applyLBracket(s) {
    $('lbk-name-1').innerHTML = '<span class="ln">' + RB.esc(RB.player(s.match.p1).last) + '</span>';
    $('lbk-name-2').innerHTML = '<span class="ln">' + RB.esc(RB.player(s.match.p2).last) + '</span>';
  }

  var SCENES = {
    rb_countdown:    { page: 'cd-page',  apply: applyCountdown },
    rb_holding:      { page: 'hp-page',  apply: applyHolding },
    rb_schedule:     { page: 'sc-page',  apply: applySchedule },
    rb_matchid:      { page: 'mi-page',  apply: applyMatchId },
    rb_matchresults: { page: 'mr-page',  apply: applyResults },
    rb_top16:        { page: 't16-page', apply: applyTop16 },
    rb_top8:         { page: 't8-page',  apply: applyTop8 },
    rb_top4:         { page: 't4-page',  apply: applyTop4 },
    rb_bracket:      { page: 'br-page',  apply: applyBracket },
    rb_leaderboard:  { page: 'lb-page',  apply: applyLeaderboard },
    rb_winner:       { page: 'wn-page',  apply: applyWinner },
    rb_split2:       { page: 's2-page',  apply: applySplit2 },
    rb_split3:       { page: 's3-page',  apply: applySplit3 },
    rb_pip:          { page: 'pp-page',  apply: applyPip },
    rb_lbracket:     { page: 'lbk-page', apply: applyLBracket },
  };

  /* ───────── background + feed windows ───────── */
  function bgOn() { bg.classList.add('on'); try { bg.play(); } catch (e) {} }
  function bgOff() {
    bg.classList.remove('on');
    setTimeout(function () { if (!active) { try { bg.pause(); } catch (e) {} } }, HIDE_MS);   // stop decoding once faded out
  }
  function cutHoles(pageEl) {
    var feeds = pageEl ? pageEl.querySelectorAll('.rb-feed') : [];
    if (!feeds.length) { bg.style.clipPath = 'none'; return; }
    var d = 'M0 0H1920V1080H0Z';
    feeds.forEach(function (f) {
      var x = f.offsetLeft, y = f.offsetTop, w = f.offsetWidth, h = f.offsetHeight;
      d += ' M' + x + ' ' + y + 'h' + w + 'v' + h + 'h' + (-w) + 'Z';
    });
    bg.style.clipPath = 'path(evenodd, "' + d + '")';
  }
  // Live preview/edit: follow the feed boxes while they are dragged in the Edit tab.
  function watchHoles(pageEl) {
    clearInterval(holeTimer);
    if (RB.preview) holeTimer = setInterval(function () { cutHoles(pageEl); }, 250);
  }

  /* ───────── show / hide ───────── */
  function preload(root, ms) {
    var imgs = [].slice.call(root.querySelectorAll('img')).filter(function (i) { return !i.complete; });
    if (!imgs.length) return Promise.resolve();
    return Promise.race([
      Promise.all(imgs.map(function (i) { return new Promise(function (r) { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); }); })),
      new Promise(function (r) { setTimeout(r, ms); }),
    ]);
  }

  async function showScene(key) {
    var sc = SCENES[key]; if (!sc) return;
    if (!RB.state) await RB.refresh();
    var pageEl = $(sc.page);
    if (active === key) { sc.apply(RB.state); RB.fitAll(pageEl); return; }
    var prev = active;
    active = key;
    if (prev && SCENES[prev]) {
      var po = $(SCENES[prev].page);
      po.classList.remove('rb-visible', 'rb-active');
      setTimeout(function () { if (active !== prev) po.classList.remove('rb-on'); }, HIDE_MS);
    }
    sc.apply(RB.state);
    await preload(pageEl, 1500);
    if (active !== key) return;                       // superseded while loading
    bgOn();
    pageEl.classList.add('rb-on');
    void pageEl.offsetWidth;                          // reflow before opacity transition
    cutHoles(pageEl); watchHoles(pageEl);
    RB.fitAll(pageEl);
    pageEl.classList.add('rb-visible', 'rb-active');
    setTimeout(function () { pageEl.classList.remove('rb-active'); }, 2000);   // animations done — later data refreshes won't replay them
  }

  function hideScene(key) {
    if (!active || (key && key !== active)) return;
    var pageEl = $(SCENES[active].page);
    active = null;
    clearInterval(holeTimer);
    pageEl.classList.remove('rb-visible', 'rb-active');
    bgOff();
    setTimeout(function () { if (!active) { pageEl.classList.remove('rb-on'); bg.style.clipPath = 'none'; } }, HIDE_MS);
  }

  /* ───────── wipe ───────── */
  var wiping = false;
  function playWipe() {
    if (wiping) return; wiping = true;
    var w = $('rb-wipe'), edge = $('wp-edge'), tex = $('wp-tex'), shade = $('wp-shade'), logo = $('wp-logo');
    var bl = $('wp-beam-l'), br = $('wp-beam-r');
    logo.src = RB.LOGO;
    w.style.display = 'block';
    var cover0 = 'polygon(0px 0px, 0px 0px, -240px 1080px, 0px 1080px)';
    var cover1 = 'polygon(0px 0px, 2160px 0px, 1920px 1080px, 0px 1080px)';
    var gone   = 'polygon(2160px 0px, 2160px 0px, 1920px 1080px, 1920px 1080px)';
    var IN = 900, HOLD = 1700, OUT = 900, T = IN + HOLD + OUT;
    var o1 = IN / T, o2 = (IN + HOLD) / T;
    var sweep = { duration: T, easing: 'cubic-bezier(.65,0,.25,1)', fill: 'both' };
    function clip(a, b, c, d) { return [{ clipPath: a, offset: 0 }, { clipPath: b, offset: o1 }, { clipPath: c, offset: o2 }, { clipPath: d, offset: 1 }]; }
    // mirror-chrome + vignette sweep in, hold, sweep out the same way (left -> right)
    [tex, shade, edge].forEach(function (e) { e.animate(clip(cover0, cover1, cover1, gone), sweep); });
    // the steel-blue layer is only visible during the sweeps, so the leading/trailing edge reads as a blue band
    edge.animate([{ opacity: .95, offset: 0 }, { opacity: 0, offset: .3 }, { opacity: 0, offset: .7 }, { opacity: .95, offset: 1 }], { duration: T, fill: 'both' });
    logo.animate([
      { opacity: 0, transform: 'scale(.82)', offset: 0 }, { opacity: 0, transform: 'scale(.82)', offset: .22 },
      { opacity: 1, transform: 'scale(1)', offset: .42 }, { opacity: 1, transform: 'scale(1.03)', offset: .72 },
      { opacity: 0, transform: 'scale(1.08)', offset: 1 },
    ], { duration: T, easing: 'ease-out', fill: 'both' });
    [bl, br].forEach(function (b, i) {
      var off = 'translateX(' + (i ? 140 : -140) + 'px)';
      b.animate([{ opacity: 0, transform: off, offset: 0 }, { opacity: 0, transform: off, offset: .2 }, { opacity: 1, transform: 'none', offset: .4 }, { opacity: 1, transform: 'none', offset: .7 }, { opacity: 0, transform: off, offset: 1 }], { duration: T, fill: 'both' });
    });
    setTimeout(function () { w.style.display = 'none'; wiping = false; }, T + 60);
  }

  /* ───────── live control ───────── */
  function onControl(msg) {
    if (msg.action === 'show') {
      if (msg.kind === 'wipe') playWipe();
      else if (msg.kind === 'scene') showScene(msg.key);
    } else if (msg.action === 'hide') {
      if (msg.kind === 'scene') hideScene(msg.key);
    } else if (msg.action === 'hideall') hideScene();
  }

  // Control-tab ◈ Preview / Edit-tab hooks: purely local, never touches the server.
  window.previewTrigger = function (event, action) {
    if (event === 'rb_wipe') { if (action === 'show') playWipe(); return; }
    if (!SCENES[event]) return;
    if (action === 'show') showScene(event); else hideScene(event);
  };
  Object.keys(SCENES).forEach(function (k) {
    window['rbEdit_' + k.slice(3)] = function () { showScene(k); };
  });
  window.rbEdit_wipe = function () { playWipe(); };

  RB.onData(function (s) {
    if (!active) return;
    SCENES[active].apply(s);
    var pageEl = $(SCENES[active].page);
    RB.fitAll(pageEl); cutHoles(pageEl);
  });
  setInterval(function () { if (active === 'rb_countdown') tickCountdown(); }, 250);

  RB.start('redbull_fullscreen').then(function () {
    if (RB.preview) return;                           // preview/edit instances ignore real broadcast state entirely
    RB.sse.addEventListener('redbull', function (e) { try { onControl(JSON.parse(e.data)); } catch (err) {} });
    fetch('/overlay/rb/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (st) {
      if (st.scene) showScene(st.scene);              // restore: a tab that (re)loads mid-broadcast comes up already showing it
    }).catch(function () {});
  });
})();
</script>
