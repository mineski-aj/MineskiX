<base href="/">
<script src="html/js/cache-bust.js"></script>
<link rel="stylesheet" href="html/mploverlay_v7.css">

<style>
  /* ── Gold Graph ── */
  #gold-graph-overlay {
    position: absolute;
    left: 508px; top: 794px;
    width: 905px; height: 286px;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    will-change: transform, opacity;
    font-family: 'General Sans', 'Arial Black', sans-serif;
  }

  #gold-graph-overlay.gg-in {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    animation: overlayIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  #gold-graph-overlay.gg-out {
    pointer-events: none;
    visibility: visible;
    opacity: 1;
    animation: overlayOut 0.35s cubic-bezier(0.55, 0, 1, 0.45) both;
  }

  .gg-header {
    height: 40px;
    background: linear-gradient(to bottom, #aca9aa 0%, #f5f5f5 20%, #f5f5f5 80%, #aca9aa 100%);
    display: flex;
    align-items: center;
    padding: 0 14px;
    flex-shrink: 0;
  }

  .gg-title {
    font-size: 13.6px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: #0f172a;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .gg-sep {
    width: 1px; height: 16px;
    background: #aca9aa;
    margin: 0 12px;
    flex-shrink: 0;
  }

  .gg-seat-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #64748b;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .gg-spacer { flex: 1; }

  .gg-team-block {
    display: flex; align-items: center; gap: 5px; flex-shrink: 0;
  }

  .gg-team-name {
    font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0;
  }

  .gg-team-c1 { color: #6088ee; }
  .gg-team-c2 { color: #e85555; }

  .gg-dot {
    width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0;
  }
  .gg-dot-c1 { background: #6088ee; }
  .gg-dot-c2 { background: #e85555; }

  .gg-vs {
    font-size: 9px; color: #94a3b8; font-weight: 700;
    letter-spacing: 0.12em; margin: 0 10px; flex-shrink: 0;
  }

  /* chart */
  .gg-chart-area {
    flex: 1;
    position: relative;
    background: #0f172a;
    overflow: hidden;
    min-height: 0;
  }

  .gg-canvas-wrap {
    position: absolute;
    inset: 8px 10px 6px 10px;
  }


  #gg-chart { display: block; width: 100% !important; height: 100% !important; }

  /* debug bar */
  #gg-debug {
    position: absolute;
    top: 12px; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  #gg-debug-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .gg-seat-btn.active-seat { background: #444; color: #fff; border-color: #777; }
</style>

<div id="scene">

  <!-- debug bar -->
  <div id="gg-debug">
    <div id="gg-debug-row">
      <span class="debug-label">GOLD GRAPH</span>
      <button class="debug-btn" id="gg-show-btn">▶ SHOW</button>
      <button class="debug-btn" id="gg-hide-btn">◀ HIDE</button>
      <div style="width:1px;height:16px;background:#333;margin:0 4px;flex-shrink:0;"></div>
      <span class="debug-label">SEAT</span>
      <button class="slot-trigger-btn gg-seat-btn active-seat" data-seat="1">1 · EXP</button>
      <button class="slot-trigger-btn gg-seat-btn" data-seat="2">2 · JGL</button>
      <button class="slot-trigger-btn gg-seat-btn" data-seat="3">3 · MID</button>
      <button class="slot-trigger-btn gg-seat-btn" data-seat="4">4 · ROAM</button>
      <button class="slot-trigger-btn gg-seat-btn" data-seat="5">5 · GOLD</button>
      <span id="gg-status" class="section-note" style="margin-left:6px;">IDLE</span>
    </div>
  </div>

  <!-- overlay -->
  <div id="gold-graph-overlay">
    <div class="gg-header">
      <span class="gg-title">Gold Graph</span>
      <div class="gg-sep"></div>
      <span class="gg-seat-label" id="gg-seat-label">EXP LANER — SEAT 1</span>
    </div>

    <div class="gg-chart-area">
      <div class="gg-canvas-wrap" id="gg-canvas-wrap">
        <canvas id="gg-chart"></canvas>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let ggChart      = null;
let ggVisible    = false;
let ggSeat       = 1;
let ggPositions  = null;
let ggEvents     = [];

const SEAT_ROLES = { 1: 'EXP LANER', 2: 'JUNGLER', 3: 'MID LANER', 4: 'ROAMER', 5: 'GOLD LANER' };

const overlay    = document.getElementById('gold-graph-overlay');
const canvasWrap = document.getElementById('gg-canvas-wrap');
const statusEl   = document.getElementById('gg-status');

function setStatus(msg) { statusEl.textContent = msg; }

function fmtTime(s) {
  const m = Math.floor(s / 60);
  return `${m}:${String(s % 60).padStart(2, '0')}`;
}

/* Try to resolve team names from match state */
const _base = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
fetch(`${_base}/match/state`).then(r => r.json()).then(state => {
  const blueIsA = (state.blueTeam === 'A');
  const c1 = blueIsA ? (state.teamA || {}) : (state.teamB || {});
  const c2 = blueIsA ? (state.teamB || {}) : (state.teamA || {});
  const n1 = c1.short || c1.name || 'CAMP 1';
  const n2 = c2.short || c2.name || 'CAMP 2';
  document.getElementById('gg-name-c1').textContent = n1.toUpperCase();
  document.getElementById('gg-name-c2').textContent = n2.toUpperCase();
}).catch(() => {});

function injectZeroCrossings(times, goldDiff) {
  const outT = [], outG = [];
  for (let i = 0; i < times.length; i++) {
    outT.push(times[i]);
    outG.push(goldDiff[i]);
    if (i < times.length - 1) {
      const g0 = goldDiff[i], g1 = goldDiff[i + 1];
      if (g0 !== null && g1 !== null && ((g0 > 0 && g1 < 0) || (g0 < 0 && g1 > 0))) {
        const frac   = g0 / (g0 - g1);
        const tCross = times[i] + (times[i + 1] - times[i]) * frac;
        outT.push(tCross);
        outG.push(0);
      }
    }
  }
  return { times: outT, goldDiff: outG };
}


function buildDiffFromPositions(positions, seat) {
  const c1 = positions.filter(p => p.camp === 1 && p.seat === seat);
  const c2 = positions.filter(p => p.camp === 2 && p.seat === seat);
  if (!c1.length && !c2.length) return null;

  const maxTime = Math.max(
    c1.length ? c1[c1.length - 1].game_time_s : 0,
    c2.length ? c2[c2.length - 1].game_time_s : 0
  );

  const c1map = new Map(c1.map(p => [p.game_time_s, p.gold]));
  const c2map = new Map(c2.map(p => [p.game_time_s, p.gold]));

  const times = [], goldDiff = [];
  for (let t = 0; t <= maxTime; t += 5) {
    times.push(t);
    const g1 = c1map.has(t) ? c1map.get(t) : null;
    const g2 = c2map.has(t) ? c2map.get(t) : null;
    goldDiff.push(g1 !== null && g2 !== null ? g1 - g2 : null);
  }
  return { times, goldDiff, maxTime };
}

async function showGoldGraph() {
  if (ggVisible) return;
  setStatus('FETCHING…');

  const base = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
  try {
    const [posRes, evtRes] = await Promise.all([
      fetch(`${base}/positions`),
      fetch(`${base}/events`),
    ]);
    ggPositions = (await posRes.json()).positions || [];
    ggEvents    = (await evtRes.json()).events    || [];
  } catch (e) {
    setStatus('ERROR: ' + e.message);
    return;
  }

  const result = buildDiffFromPositions(ggPositions, ggSeat);
  if (!result) { setStatus('NO DATA'); return; }

  buildChart(result.times, result.goldDiff, ggEvents);

  overlay.classList.remove('gg-out');
  void overlay.offsetWidth;
  overlay.classList.add('gg-in');
  animateScan(ggChart);

  ggVisible = true;
  setStatus('SHOWING — ' + fmtTime(result.maxTime));
}

function switchSeat(seat) {
  ggSeat = seat;
  document.getElementById('gg-seat-label').textContent = `${SEAT_ROLES[seat]} — SEAT ${seat}`;
  document.querySelectorAll('.gg-seat-btn').forEach(b => b.classList.toggle('active-seat', +b.dataset.seat === seat));

  if (!ggVisible || !ggPositions) return;

  const result = buildDiffFromPositions(ggPositions, seat);
  if (!result) { setStatus('NO DATA FOR SEAT ' + seat); return; }

  buildChart(result.times, result.goldDiff, ggEvents);
  animateScan(ggChart);
  setStatus('SEAT ' + seat + ' — ' + fmtTime(result.maxTime));
}

function hideGoldGraph() {
  if (!ggVisible) return;
  overlay.classList.remove('gg-in');
  overlay.classList.add('gg-out');
  setTimeout(() => {
    overlay.classList.remove('gg-out');
    ggVisible = false;
  }, 380);
  setStatus('IDLE');
}

/* ── Scan-draw animation ── */
const scanPlugin = {
  id: 'scanDraw',
  beforeDraw(chart) {
    const p = chart._scanProgress;
    if (p == null || p >= 1) return;
    const { ctx, chartArea } = chart;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, chartArea.left + (chartArea.right - chartArea.left) * p, chart.height);
    ctx.clip();
  },
  afterDraw(chart) {
    const p = chart._scanProgress;
    if (p != null && p < 1) {
      const { ctx, chartArea } = chart;
      ctx.restore();
      const x = chartArea.left + (chartArea.right - chartArea.left) * p;
      /* glowing cursor line */
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,1)';
      ctx.shadowBlur  = 14;
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth   = 2;
      ctx.stroke();
      ctx.restore();
    }
  }
};

function animateScan(chart, duration = 650) {
  const ease = t => 1 - Math.pow(1 - t, 3);
  const start = performance.now();

  chart._scanProgress = 0;

  (function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    chart._scanProgress = ease(t);
    chart.draw();
    if (t < 1) { requestAnimationFrame(frame); return; }

    chart._scanProgress = 1;
    animateFillIn(chart);
  })(performance.now());
}

function animateFillIn(chart, duration = 450) {
  const ease  = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad
  const start = performance.now();

  (function frame(now) {
    const t     = Math.min((now - start) / duration, 1);
    const alpha = ease(t) * 0.13;
    chart.data.datasets[0].fill = {
      target: 'origin',
      above: `rgba(96,136,238,${alpha.toFixed(4)})`,
      below: `rgba(232,85,85,${alpha.toFixed(4)})`,
    };
    chart.update('none');
    if (t < 1) requestAnimationFrame(frame);
  })(performance.now());
}

const BLUE = '#6088ee';
const RED  = '#e85555';
function segmentColor(ctx) {
  const y0 = ctx.p0.parsed.y, y1 = ctx.p1.parsed.y;
  if (y0 == null && y1 == null) return BLUE;
  const mid = (y0 != null && y1 != null) ? (y0 + y1) / 2 : (y0 ?? y1);
  return mid >= 0 ? BLUE : RED;
}

function drawDagger(c, x, y, color) {
  const s = 7;
  c.save();
  c.translate(x, y);
  c.rotate(Math.PI / 4); // 45° diagonal
  c.strokeStyle = color;
  c.lineWidth   = 2;
  c.lineCap     = 'round';
  // Blade
  c.beginPath(); c.moveTo(0, -s); c.lineTo(0, s * 0.4); c.stroke();
  // Guard
  c.beginPath(); c.moveTo(-s * 0.55, s * 0.05); c.lineTo(s * 0.55, s * 0.05); c.stroke();
  // Pommel dot
  c.beginPath(); c.arc(0, s * 0.55, 1.4, 0, Math.PI * 2);
  c.fillStyle = color; c.fill();
  c.restore();
}

function buildChart(times, goldDiff, events) {
  const ctx = document.getElementById('gg-chart').getContext('2d');
  if (ggChart) { ggChart.destroy(); ggChart = null; }

  const inj = injectZeroCrossings(times, goldDiff);
  times    = inj.times;
  goldDiff = inj.goldDiff;

  const vals   = goldDiff.filter(v => v !== null);
  const rawMax = vals.length ? Math.max(...vals) : 2000;
  const rawMin = vals.length ? Math.min(...vals) : -2000;
  const pad    = Math.max(Math.abs(rawMax - rawMin) * 0.12, 300);
  const yMax   = Math.ceil((rawMax + pad) / 500) * 500;
  const yMin   = Math.floor((rawMin - pad) / 500) * 500;

  const zeroLine = {
    id: 'zeroLine',
    afterDraw(chart) {
      const { ctx: c, chartArea, scales } = chart;
      if (!scales.y) return;
      const y = scales.y.getPixelForValue(0);
      c.save();
      c.beginPath();
      c.moveTo(chartArea.left, y);
      c.lineTo(chartArea.right, y);
      c.strokeStyle = 'rgba(255,255,255,0.25)';
      c.lineWidth = 1.5;
      c.stroke();
      c.restore();
    }
  };

  const seatEvents = (events || []).filter(e =>
    e.seat === ggSeat && e.type === 'kill'
  );

  const eventsPlugin = {
    id: 'eventsPlugin',
    afterDraw(chart) {
      if (!seatEvents.length) return;
      const { ctx: c, chartArea, scales } = chart;
      const scanProg = chart._scanProgress != null ? chart._scanProgress : 1;
      const maxTs    = times[times.length - 1] || 1;
      const baseY    = chartArea.bottom + 13;

      // Group events by time_s for stacking
      const byTime = new Map();
      for (const ev of seatEvents) {
        if (!byTime.has(ev.time_s)) byTime.set(ev.time_s, []);
        byTime.get(ev.time_s).push(ev);
      }

      for (const [ts, evs] of byTime) {
        if (ts > maxTs * scanProg) continue;
        const idx = times.reduce((best, t, i) =>
          Math.abs(t - ts) < Math.abs(times[best] - ts) ? i : best, 0);
        const x = scales.x.getPixelForValue(idx);
        evs.forEach((ev, i) => {
          const cy = baseY - i * 19;
          drawDagger(c, x, cy, ev.camp === 'camp1' ? BLUE : RED);
        });
      }
    }
  };

  ggChart = new Chart(ctx, {
    type: 'line',
    plugins: [zeroLine, scanPlugin, eventsPlugin],
    data: {
      labels: times.map(fmtTime),
      datasets: [{
        data: goldDiff,
        fill: { target: 'origin', above: 'rgba(96,136,238,0)', below: 'rgba(232,85,85,0)' },
        borderColor: BLUE,
        segment: { borderColor: segmentColor },
        borderWidth: 2,
        tension: 0,
        pointRadius: 0,
        spanGaps: true,
      }]
    },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false },
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          border: { color: 'rgba(255,255,255,0.15)', width: 1 },
          ticks: {
            color: '#ffffff',
            font: { size: 14, family: "'General Sans', sans-serif" },
            maxRotation: 0,
            autoSkip: false,
            padding: 26,
            callback(val, i) {
              const t = times[i];
              if (!t || t % 60 !== 0) return '';
              const maxMins   = Math.ceil((times[times.length - 1] || 0) / 60);
              const rawStep   = maxMins / 12;
              const labelStep = rawStep <= 1 ? 1 : rawStep <= 2 ? 2 : rawStep <= 3 ? 3 : rawStep <= 5 ? 5 : 10;
              return Math.round(t / 60) % labelStep === 0 ? fmtTime(t) : '';
            }
          }
        },
        y: {
          min: yMin, max: yMax,
          afterBuildTicks(axis) {
            const pos = axis.ticks.filter(t => t.value > 0);
            const neg = axis.ticks.filter(t => t.value < 0);
            function pick3(arr) {
              if (arr.length <= 3) return arr;
              const hi = arr.length - 1;
              return [arr[0], arr[Math.round(hi / 2)], arr[hi]];
            }
            const zero = axis.ticks.some(t => t.value === 0)
              ? [axis.ticks.find(t => t.value === 0)]
              : [{ value: 0 }];
            axis.ticks = [...pick3(neg), ...zero, ...pick3(pos)];
          },
          grid: { color: 'rgba(255,255,255,0.05)' },
          border: { display: false },
          ticks: {
            color: '#ffffff',
            font: { size: 14, family: "'General Sans', sans-serif" },
            callback(v) {
              if (v === 0) return '0';
              const abs = Math.abs(v);
              const str = abs >= 1000 ? `${(abs / 1000).toFixed(1)}K` : abs;
              return v > 0 ? `+${str}` : `-${str}`;
            },
          }
        }
      }
    }
  });
}

document.getElementById('gg-show-btn').addEventListener('click', showGoldGraph);
document.getElementById('gg-hide-btn').addEventListener('click', hideGoldGraph);
document.querySelectorAll('.gg-seat-btn').forEach(btn => {
  btn.addEventListener('click', () => switchSeat(+btn.dataset.seat));
});
</script>
