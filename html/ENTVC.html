    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── CONFIG BAR ── */
    #config-bar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #111;
      border-bottom: 1px solid #333;
      padding: 6px 12px;
      flex-direction: column;
      font-family: monospace;
      font-size: 12px;
      color: #aaa;
      z-index: 9999;
      gap: 2px;
    }
    #config-bar.debug-open { display: flex; }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
    }
    .bar-row + .bar-row {
      border-top: 1px solid #222;
    }
    #config-bar label { color: #666; white-space: nowrap; }
    #server-url {
      background: #1e1e1e;
      border: 1px solid #444;
      color: #eee;
      padding: 3px 8px;
      font-family: monospace;
      font-size: 12px;
      width: 260px;
      border-radius: 3px;
    }
    #server-url:focus { outline: none; border-color: #888; }
    #url-status { font-size: 11px; color: #555; }
    #url-status.ok  { color: #22c55e; }
    #url-status.err { color: #ef4444; }

    /* debug buttons */
    .dbg-label { color: #555; font-size: 11px; }
    .dbg-btn {
      font-family: monospace;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid #444;
      cursor: pointer;
      background: #1e1e1e;
      color: #aaa;
    }
    .dbg-btn:hover { border-color: #888; color: #fff; }
    .dbg-btn.show { border-color: #22c55e; color: #22c55e; }
    .dbg-btn.show:hover { background: #22c55e; color: #000; }
    .dbg-btn.hide { border-color: #ef4444; color: #ef4444; }
    .dbg-btn.hide:hover { background: #ef4444; color: #fff; }
    .dbg-btn.preview { border-color: #d97706; color: #d97706; }
    .dbg-btn.preview:hover, .dbg-btn.preview.active { background: #d97706; color: #000; border-color: #d97706; }
    .feature-card { border-top: 1px solid #222; padding: 5px 0 4px; }
    .feature-card-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 5px; }
    .feature-card-btns { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #sse-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      display: inline-block;
      margin-right: 2px;
    }
    #sse-dot.connected { background: #22c55e; }
    #sse-dot.error     { background: #ef4444; }

    /* ── BROADCAST CANVAS ── */
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }
    #canvas {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      position: relative;
      contain: layout paint;
    }
    #canvas.bg-black { background: #000; }

    /* ── BG VIDEO ── */
    #bg-video {
      position: absolute;
      top: 0; left: 0;
      width: 1920px; height: 1080px;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }
    /* Shared background video for the 5 scenes below — two stacked layers
       (crossfade between different files, see showSceneVideo), both
       sitting directly above #bg-video (same z-index, later in DOM = on
       top); #bg-video shows through whenever neither layer is visible. */
    #scene-video-0, #scene-video-1 {
      position: absolute;
      top: 0; left: 0;
      width: 1920px; height: 1080px;
      object-fit: cover;
      z-index: 0;
      opacity: 0;
      transition: opacity 400ms ease;
      pointer-events: none;
    }
    #scene-video-0.sv-visible, #scene-video-1.sv-visible { opacity: 1; }

    /* ── WAITING SCREEN TVC PAGE ── */
    #waiting-screen-page {
      position: absolute;
      top: 0; left: 0;
      width: 1920px; height: 1080px;
      display: none;
      overflow: hidden;
      background: transparent; /* #scene-video shows through — see showSceneVideo */
      opacity: 0;
      transition: opacity 400ms ease;
    }
    #waiting-screen-page.ws-on { display: block; }
    #waiting-screen-page.ws-visible { opacity: 1; }
    #ws-header {
      position: absolute;
      left: 40px; top: 80px;
      width: 1028px; height: 150px;
    }
    #ws-header img { display: block; width: 1028px; height: 150px; }
    /* The black date chip is already baked into S18_Header.png — this just
       overlays the "WEEK n DAY n" text on top of it, in place. */
    #ws-week-label {
      position: absolute;
      left: 712px; top: 116px;
      width: 253px; height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'General Sans', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: #fff;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── WAITING SCREEN — COUNTDOWN TIMER ── */
    /* width/height frozen at the box's old flex-computed size (160 label +
       20 gap + 355 value, tallest child 130px) now that #ws-timer-value is
       pulled out to position:absolute below — without this, removing the
       value from the flex flow would shrink-to-fit the container down to
       just the label's size and shift the whole thing (it's right-anchored)
       and re-center the label vertically, moving it even though nobody
       asked to move the label. */
    #ws-timer {
      position: absolute;
      top: 88px; right: 130px;
      width: 535px; height: 130px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: 'General Sans', sans-serif;
      color: #0a0a0a;
    }
    #ws-timer-label {
      width: 160px; height: 47px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      z-index: 0;
    }
    /* Scoped to the ID, not "#ws-timer-label img" — a generic descendant
       selector would also clamp #ws-timer-label-bg (also an <img> inside
       this box) to the OLD 160x47 label size via max-width/max-height:
       100%, silently overriding any width/height set from the dashboard
       Edit tab. */
    #ws-timer-label-img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
    }
    /* Background plaque behind the label graphic — see mplfs.html's
       #ws-timer-label-bg for why this is a child of the label box rather
       than a canvas-absolute sibling. */
    #ws-timer-label-bg {
      position: absolute;
      z-index: -1;
      left: -9.5px; top: -11px;
      width: 179px; height: 69px;
      object-fit: cover;
      pointer-events: none;
    }
    /* Pulled out of #ws-timer's flex flow so it can be dragged/resized and
       font-size-tuned independently from the dashboard Edit tab — left/top
       are LOCAL offsets against #ws-timer's own box (180 = label's 160px
       width + 20px gap; 0 = same top as the now-frozen #ws-timer box),
       matching exactly where the old flex layout put it, so this default
       doesn't shift anything on first load. */
    #ws-timer-value {
      position: absolute;
      left: 180px; top: 0px;
      width: 355px; /* fixed — font isn't truly tabular, digit widths vary enough to make the label drift otherwise */
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 130px;
      line-height: 1;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-align: left;
    }

    /* ── WAITING SCREEN — TODAY'S MATCHES PANEL ── */
    #ws-matches {
      position: absolute;
      left: 40px; top: 280px;
      width: 571px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-family: 'General Sans', sans-serif;
    }
    #ws-matches .wsm-title { display: block; width: 571px; height: 61px; margin-bottom: 10px; }
    /* Match row — header band (label/time/BO) and box are baked into one
       571×173 asset now, so the band text/blinker overlay the box's own
       top 39px instead of a separate strip element */
    .wsm-box {
      position: relative;
      width: 571px; height: 173px;
    }
    .wsm-box > img.wsm-box-bg { position: absolute; left: 0; top: 0; width: 571px; height: 173px; }
    .wsm-box .wsm-band-label,
    .wsm-box .wsm-band-time,
    .wsm-box .wsm-band-bo {
      position: absolute; top: 0; height: 39px;
      display: flex; align-items: center;
      font-weight: 800; font-size: 19px; color: #0a0a0a;
      text-transform: uppercase; white-space: nowrap;
    }
    .wsm-box .wsm-band-label { left: 14px; }
    .wsm-box .wsm-band-time  { left: 0; width: 100%; justify-content: center; }
    .wsm-box .wsm-band-bo    { right: 14px; }
    .wsm-box .wsm-band-cot     { position: absolute; left: 169px; top: 0; width: 233px; height: 39px; }
    .wsm-box .wsm-band-cot-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* Star match band — rivalry banner masks in, does a metal-shine sweep,
       holds, does a second sweep right before it exits, then masks out; the
       match time cross-fades in for the rest of the 9s cycle so the band
       is never empty.
       Timeline (of the 9s cycle, all phases scaled down from the original
       10s): 0.0–0.9s mask in, 0.9–1.6s shine sweep, 1.7–3.6s hold,
       3.6–4.3s second shine sweep, 4.3–5.2s mask out, 5.3–9s match time
       shows. */
    .wsm-box .wsm-band-cot        { animation: wsm-cot-mask 9s ease-in-out infinite; }
    .wsm-box .wsm-band-time.star  { animation: wsm-cot-pulse-inv 9s ease-in-out infinite; }
    @keyframes wsm-cot-mask {
      0%     { clip-path: inset(0 100% 0 0); }

      18%     { background-position: 150% 0; }

<body>

  <!-- ── CONFIG BAR ── -->
  <div id="config-bar">

    <!-- Server status row -->
    <div class="bar-row">
      <label>SERVER</label>
      <span id="server-url" style="font-family:monospace;font-size:12px;color:#94a3b8;"></span>
      <span id="sse-dot"></span>
      <span style="width:1px;background:#333;align-self:stretch;margin:0 4px"></span>
      <button class="dbg-btn" id="bg-toggle" onclick="toggleBg()">BG: transparent</button>
    </div>

    <!-- WAITING SCREEN TVC -->
    <div class="feature-card">
      <div class="feature-card-label">Waiting Screen TVC</div>
      <div class="feature-card-btns">
        <button class="dbg-btn show" onclick="showWaitingScreen()">▶ SHOW</button>
        <button class="dbg-btn hide" onclick="hideWaitingScreen()">■ HIDE</button>
        <button class="dbg-btn preview" id="preview-waiting" onclick="toggleLocalPreview('waiting', this)">◈ PREVIEW</button>
      </div>
    </div>

  </div>

  <!-- ── BROADCAST CANVAS ── -->
  <div id="canvas">
    <video id="bg-video" src="/assets/bgloop.webm" autoplay loop muted playsinline></video>
    <!-- Shared background for the 5 video-backed scenes below (Waiting
         Screen TVC, Waiting Lobby, Team Hexagon, Today's Schedule,
         Standings) — two stacked layers (crossfade pattern, same idea as
         the waiting-lobby/hexagon player photo swap) instead of one video
         per scene: switching to a scene using the SAME file just keeps it
         playing untouched (no reload); switching to a DIFFERENT file
         crossfades from the old layer to the new one instead of cutting.
         See showSceneVideo/SCENE_VIDEO_SRC. -->
    <video id="scene-video-0" loop muted playsinline preload="auto"></video>
    <video id="scene-video-1" loop muted playsinline preload="auto"></video>
    <div id="waiting-screen-page">
      <div id="ws-header">
        <img src="/assets/Waiting Screen TVC/S18_Header.png" alt="MPL Philippines — Season 18 Regular Season">
        <div id="ws-week-label">WEEK 8 DAY 3</div>
      </div>
      <div id="ws-matches"></div>
      <div id="ws-hosts" class="ws-talent-box"></div>
      <div id="ws-casters" class="ws-talent-box"></div>
      <div id="ws-sponsor"></div>
      <div id="ws-timer">
        <div id="ws-timer-label"><img id="ws-timer-label-bg" src="/assets/Waiting Screen TVC/timeback.png" alt=""><img id="ws-timer-label-img" src="/assets/Waiting Lobby/SHOW STARTS IN.png" alt="Show starts in"></div>
        <div id="ws-timer-value">30:30</div>
      </div>
    </div>
  </div>

  <script>
    /* ════════════════════════════════════════════════
       SHARED SERVER URL
    ════════════════════════════════════════════════ */
    function buildUrl(path) {
      return window.location.origin + path;
    }


    const sseDot    = document.getElementById('sse-dot');
    document.getElementById('server-url').textContent = window.location.origin;



    const canvas = document.getElementById('canvas');
    const bgToggleBtn = document.getElementById('bg-toggle');
    function toggleBg() {
      const on = canvas.classList.toggle('bg-black');
      bgToggleBtn.textContent = on ? 'BG: black' : 'BG: transparent';
    }
    /* ── SSE — overlay trigger ── */
    let sseSource = null;

    /* ENTVC.html — standalone Waiting TVC. Unlike mplfs.html this page
       never switches or hides scenes in response to remote show/hide SSE
       events; it only listens for live match-board updates ('match') so
       hosts/casters/timer/schedule rows stay current while permanently
       showing the Waiting Screen TVC scene (see restoreScene() below). */
    function connectSSE() {
      if (sseSource) sseSource.close();
      // Backed by the shared SharedWorker (html/js/overlay-shared-worker.js)
      // — this page opens zero real connections of its own now, so having
      // several overlay browser sources/tabs open at once no longer eats
      // into the browser's shared connection pool per page.
      sseSource = createOverlaySSE();

      sseSource.onopen = () => {
        const wasDisconnected = sseDot.className === 'error';
        sseDot.className = 'connected';
        if (wasDisconnected) restoreScene(true);
      };
      sseSource.onerror = () => {
        sseDot.className = 'error';
        /* EventSource auto-reconnects — no manual retry needed */
      };

      /* Fired by routes/overlayStyles.js after any Edit-tab Save — force
         a hard reload so new position/size overrides apply immediately
         (see mplfs.html's connectSSE() for the identical pattern). */
      sseSource.addEventListener('reload', () => { window.location.reload(); });

      sseSource.addEventListener('match', (e) => {
        let ms = null;
        try { ms = JSON.parse(e.data); } catch { return; }
        onMatchEvent(ms);
      });
    }

    function reconnectSSE() {
      if (sseSource) { sseSource.close(); sseSource = null; }
      sseDot.className = '';
      connectSSE();
    }

    /* ════════════════════════════════════════════════
       FEATURE SWITCHER — ENTVC.html only ever shows one scene (Waiting
       Screen TVC), so this is a trimmed-down version of mplfs.html's
       switcher: no POST_FEATURES/match-board bookkeeping, just the
       activeFeature bookkeeping showWaitingScreen's transitionTo() call
       needs, and requestedFeature for restoreScene's reconnect guard.
    ════════════════════════════════════════════════ */
    let activeFeature = null;
    let requestedFeature = null;
    let transitionChain = Promise.resolve();

    function transitionTo(newFeature) {
      requestedFeature = newFeature;
      return transitionChain = transitionChain.then(() => transitionToImpl(newFeature));
    }

    async function transitionToImpl(newFeature) {
      await hideActiveFeature();
      activeFeature = newFeature;
    }

    function hideActiveFeature() {
      if (!activeFeature) return Promise.resolve();
      activeFeature = null;
      requestedFeature = null;
      return hideWaitingScreen();
    }

    /* Live match-state updates — any Match Board change refreshes the
       Waiting Screen TVC's rows/week-day chip as soon as it's saved.
       Called from the 'match' listener registered inside connectSSE()
       above. */
    function onMatchEvent(ms) {
      if (activeFeature === 'waiting') updateWsFromState(ms);
    }

    /* ════════════════════════════════════════════════
       SHARED SCENE BACKGROUND VIDEO
       Two stacked <video> layers behind all 5 scenes below instead of one
       per scene:
         - Back-to-back scenes using the SAME file (e.g. Waiting Lobby →
           Waiting Screen TVC, both bgloopsun2.webm) — untouched, just keeps
           playing, no reload.
         - Same file after a gap (scene hidden, then a scene using that
           same file shows again later) — the already-loaded layer just
           fades back in, no restart.
         - Different file — crossfades: the new file plays on the other
           (inactive) layer while it fades in, and the old layer fades out
           at the same time, instead of a hard cut.
    ════════════════════════════════════════════════ */
    const sceneVideoEls = [document.getElementById('scene-video-0'), document.getElementById('scene-video-1')];
    const SCENE_VIDEO_SRC = {
      waiting: '/assets/bgloopsun2.webm',
    };
    let currentSceneVideoSrc = null;
    let sceneVideoLayer = 0;   // which of sceneVideoEls is the active/on-top layer
    let sceneVideoVisible = false;

    function showSceneVideo(feature) {
      const src = SCENE_VIDEO_SRC[feature];

      if (src === currentSceneVideoSrc) {
        if (!sceneVideoVisible) sceneVideoEls[sceneVideoLayer].classList.add('sv-visible'); // same file after a gap — just reveal it again
        sceneVideoVisible = true;
        return; // back-to-back with the same file — leave it exactly as it is
      }

      const nextLayer = 1 - sceneVideoLayer;
      const curEl  = sceneVideoEls[sceneVideoLayer];
      const nextEl = sceneVideoEls[nextLayer];
      nextEl.src = src;
      nextEl.currentTime = 0;
      nextEl.play().catch(() => {});
      nextEl.classList.add('sv-visible');   // crossfade new layer in...
      curEl.classList.remove('sv-visible'); // ...old layer out, at the same time

      sceneVideoLayer = nextLayer;
      currentSceneVideoSrc = src;
      sceneVideoVisible = true;
    }

    function hideSceneVideo() {
      sceneVideoEls[sceneVideoLayer].classList.remove('sv-visible');
      sceneVideoVisible = false;
    }

    /* ════════════════════════════════════════════════
       WAITING SCREEN TVC
    ════════════════════════════════════════════════ */
    const wsPage  = document.getElementById('waiting-screen-page');

    /* Today's Matches config — edit here (or feed from server later) */
    const WS_ASSET    = '/assets/Waiting Screen/';
    const WS_TVC_ASSET = '/assets/Waiting Screen TVC/';
    const WS_MATCHES = [
      { label: 'MATCH 1', time: '14:30 GMT +8', bo: 'B03', matchType: 'regular',
        left: { tri: 'ONIC' }, right: { tri: 'ONIC' }, score: { l: 2, r: 0 } },
      { label: 'MATCH 2', time: '',              bo: 'B03', matchType: 'clash',
        left: { tri: 'ONIC' }, right: { tri: 'FLCN' } },
      { label: 'MATCH 3', time: '18:30 GMT +8', bo: 'B03', matchType: 'regular',
        left: { tri: 'ONIC' }, right: { tri: 'ONIC' } },
    ];
    /* Match type → Waiting Screen TVC box art + pulsing rivalry banner.
       Keys match the Match Board's match-type dropdown values. */
    const WS_MATCH_TYPE_ASSETS = {
      regular:       { box: 'MatchBox_REGULAR MATCH',    blinker: null },
      epic:          { box: 'MatchBox_EPIC RIVALRY',      blinker: 'EPIC RIVALRY BLINKER' },
      international: { box: 'MatchBox_INTERNATIONAL',     blinker: 'INTERNATIONAL RIVALRY BLINKER' },
      golden:        { box: 'MatchBox_GOLDEN RIVALRY',    blinker: 'GOLDEN RIVALRY BLINKER' },
      clash:         { box: 'MatchBox_CLASH OF TITANS',   blinker: 'CLASH OF TITANS BLINKER' },
    };

    /* Today's Schedule config — edit here (or feed from server later) */
    const TS_MATCHES = [
      { label: 'MATCH 1', time: '14:30 GMT +8', bo: 'B03', star: false,
        left: { tri: 'ONIC' }, right: { tri: 'ONIC' } },
      { label: 'MATCH 2', time: '16:30 GMT +8', bo: 'B03', star: false,
        left: { tri: 'ONIC' }, right: { tri: 'ONIC' } },
      { label: 'MATCH 3', time: '18:30 GMT +8', bo: 'B03', star: false,
        left: { tri: 'ONIC' }, right: { tri: 'ONIC' } },
    ];

    /* Countdown — server-authoritative (see /match/timer + ms.timer). endAt
       is an absolute epoch-ms timestamp set by the Match Board, so a refresh
       of this page (or a full server restart) just picks the clock back up
       instead of restarting it; setInterval only re-renders the local
       display, it never owns the count. */
    const WS_TIMER_DEFAULT = { running: false, endAt: null, remaining: 30 * 60 + 30 };
    let wsTimerState = WS_TIMER_DEFAULT;
    const wsTimerValue = document.getElementById('ws-timer-value');
    let wsTimerInt = null;

    /* endAt is the server's absolute epoch-ms clock; a machine whose own
       system clock is skewed from the server's would otherwise show a wildly
       wrong countdown (e.g. hours off) even though the server's state is
       correct. serverNow (sent with every /match/state response) lets us
       measure and cancel out that skew instead of trusting Date.now() raw. */
    let clockOffset = 0;
    function syncClockOffset(ms) {
      if (ms && typeof ms.serverNow === 'number') clockOffset = ms.serverNow - Date.now();
    }

    function renderTimerFromState(el, t) {
      const remain = (t && t.running && t.endAt)
        ? Math.max(0, Math.round((t.endAt - (Date.now() + clockOffset)) / 1000))
        : Math.max(0, (t && t.remaining) || 0);
      const m = Math.floor(remain / 60), s = remain % 60;
      el.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function startWsTimer() {
      clearInterval(wsTimerInt);
      renderTimerFromState(wsTimerValue, wsTimerState);
      wsTimerInt = setInterval(() => renderTimerFromState(wsTimerValue, wsTimerState), 250);
    }

    function stopWsTimer() {
      clearInterval(wsTimerInt);
      wsTimerInt = null;
    }

    /* Match Board state → match rows (shared by Waiting Screen TVC and
       Today's Schedule). Returns null when no state is available so callers
       can fall back to their placeholder configs. */
    function msToMatchRows(state) {
      if (!state || !Array.isArray(state.todayMatches) || !state.todayMatches.length) return null;
      const bo  = (state.series || 'BO3').toUpperCase();
      const hId = state.home ? state.home.teamId : null;
      const aId = state.away ? state.away.teamId : null;
      /* Days 1 & 3 run only two matches — the Match 3 row is not shown */
      const isDay2 = (state.day || 1) === 2;
      return state.todayMatches.slice(0, isDay2 ? 3 : 2).map((m, i) => {
        /* Once the currently-active match's live score has actually started
           moving, follow that instead of the card's own score1/score2 — but
           an untouched 0-0 live score must never stomp a score already set
           on the card (team IDs match trivially whenever the same team faces
           itself in the placeholder data, which isn't "the game is 0-0"). */
        let s1 = m.score1 || 0, s2 = m.score2 || 0;
        const liveStarted = !!(state.home && state.away && ((state.home.score || 0) || (state.away.score || 0)));
        if (liveStarted && hId && aId && m.team1Id && m.team2Id) {
          if      (m.team1Id === hId && m.team2Id === aId) { s1 = state.home.score || 0; s2 = state.away.score || 0; }
          else if (m.team1Id === aId && m.team2Id === hId) { s1 = state.away.score || 0; s2 = state.home.score || 0; }
        }
        return {
          label: 'MATCH ' + (i + 1),
          time:  m.time || '',
          bo,
          star:  !!m.star,
          matchType: m.matchType || (m.star ? 'clash' : 'regular'),
          left:  { tri: m.team1Short || '', logo: m.team1Short ? '/logos/' + encodeURIComponent(m.team1Short) + '.png' : null },
          right: { tri: m.team2Short || '', logo: m.team2Short ? '/logos/' + encodeURIComponent(m.team2Short) + '.png' : null },
          score: (s1 === 0 && s2 === 0) ? null : { l: s1, r: s2 },
        };
      });
    }

    /* Match times come from the Match Board as free text (e.g. "5:00 PM"),
       not a fixed format — normalize to 24-hour "HH:MM GMT+8" for display
       here regardless of how it was typed. Falls back to the raw string
       unchanged if it doesn't look like a time at all, rather than hiding
       a value the caster/producer typed. */
    function wsFormatTimeGmt8(raw) {
      const s = String(raw || '').trim();
      const m = s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
      if (!m) return s;
      let h = parseInt(m[1], 10);
      const min = m[2];
      const ap = m[3] ? m[3].toUpperCase() : null;
      if (ap === 'PM' && h < 12) h += 12;
      if (ap === 'AM' && h === 12) h = 0;
      return String(h).padStart(2, '0') + ':' + min + ' GMT+8';
    }

    function buildWsMatches(rootId, matches, opts) {
      opts = opts || {};
      const root = document.getElementById(rootId);
      const logo = (m, side) =>
        `<div class="wsm-slot wsm-logo-${side}"><img src="${(m[side === 'l' ? 'left' : 'right'].logo) || (WS_ASSET + 'Null_Icon.png')}" ` +
        `onerror="this.onerror=null;this.src='${WS_ASSET}Null_Icon.png'" alt=""></div>`;
      let html = opts.title === false ? '' : `<img class="wsm-title" src="${WS_TVC_ASSET}TodayMatches.png" alt="Today's Matches">`;
      matches.forEach(m => {
        const typeAssets = WS_MATCH_TYPE_ASSETS[m.matchType] || WS_MATCH_TYPE_ASSETS.regular;
        const center = m.score
          ? `<img class="wsm-score-img" src="${WS_TVC_ASSET}SCORES/${m.score.l}-${m.score.r}.png" ` +
            `onerror="this.onerror=null;this.outerHTML='<div class=&quot;wsm-score&quot;><span class=&quot;wsm-score-l&quot;>${m.score.l}</span><span class=&quot;wsm-score-div&quot;></span><span class=&quot;wsm-score-r&quot;>${m.score.r}</span></div>'" ` +
            `alt="${m.score.l}-${m.score.r}">`
          : `<img class="wsm-vs" src="${WS_TVC_ASSET}SCORES/vs.png" alt="VS">`;
        html += `<div class="wsm-box"><img class="wsm-box-bg" src="${WS_TVC_ASSET}${typeAssets.box}.png" alt="">` +
          `<span class="wsm-band-label">${m.label}</span>` +
          (typeAssets.blinker
            ? `<span class="wsm-band-time star">${wsFormatTimeGmt8(m.time)}</span>` +
              `<div class="wsm-band-cot"><img class="wsm-band-cot-img" src="${WS_TVC_ASSET}${typeAssets.blinker}.png" alt="${typeAssets.blinker}"></div>`
            : `<span class="wsm-band-time">${wsFormatTimeGmt8(m.time)}</span>`) +
          `<span class="wsm-band-bo">${m.bo}</span>` +
          `<div class="wsm-slot wsm-tri wsm-tri-l">${m.left.tri}</div>` +
          logo(m, 'l') +
          `<div class="wsm-slot wsm-center">${center}</div>` +
          logo(m, 'r') +
          `<div class="wsm-slot wsm-tri wsm-tri-r">${m.right.tri}</div></div>`;
      });
      root.innerHTML = html;

      /* Tag both the match-row container and the whole scene page with the
         real row count so the dashboard Edit tab can position the
         header/match/sponsor boards independently per 2-match/3-match day
         (see mplfs_wsmatches_2m/3m in dashboard.html). Mirrored from
         mplfs.html's buildWsMatches — without this, the saved position
         overrides (scoped to #waiting-screen-page.wsm-count-N ...) never
         match anything here, since the class was never applied. */
      const countClass = 'wsm-count-' + matches.length;
      root.classList.remove('wsm-count-2', 'wsm-count-3');
      root.classList.add(countClass);
      wsPage.classList.remove('wsm-count-2', 'wsm-count-3');
      wsPage.classList.add(countClass);
    }
    buildWsMatches('ws-matches', WS_MATCHES);

    /* Sponsor box — lives outside the Matches/Hosts/Casters carousel so it
       stays on screen the whole time instead of transitioning with whichever
       panel happens to be showing. Draft/in-game style loop (see
       startWsSponsorLoop below) — same /api/sponsors source, per-sponsor
       duration, and slide timing as Draft.html's #sponsor-loop and the
       Waiting Lobby's sponsor box, instead of the old fixed 3s crossfade. */
    function buildWsSponsor() {
      document.getElementById('ws-sponsor').innerHTML =
        `<div class="wsm-sponsor"><img src="${WS_TVC_ASSET}Sponsor Box.png" alt="Official Sponsor">` +
        `<div class="sponsor-cat-label" id="ws-sponsor-cat"></div>` +
        `<div class="ws-sponsor-loop"><img id="ws-sponsor-img" src="" alt=""></div></div>`;
    }
    buildWsSponsor();

    let wsSponsors = [], wsSponsorIdx = 0, wsSponsorActive = false;
    let wsSponsorInHandler = null, wsSponsorOutHandler = null, wsSponsorHoldTimer = null;

    function startWsSponsorLoop() {
      wsSponsorActive = true;
      fetch('/api/sponsors').then(r => r.json()).then(list => {
        if (!wsSponsorActive || !list || !list.length) return;
        wsSponsors = list;
        wsSponsorIdx = 0;
        runWsSponsorLoop();
      }).catch(() => {});
    }

    function runWsSponsorLoop() {
      if (!wsSponsorActive) return;
      const img = document.getElementById('ws-sponsor-img');
      if (!img) return;
      const s = wsSponsors[wsSponsorIdx];
      img.className = '';
      img.src = s.src;
      updateSponsorCatLabel('ws-sponsor-cat', s.category);
      void img.offsetWidth;
      img.classList.add('spon-in');

      wsSponsorInHandler = (ev) => {
        if (ev.propertyName !== 'transform') return;
        img.removeEventListener('transitionend', wsSponsorInHandler);
        wsSponsorHoldTimer = setTimeout(() => {
          if (!wsSponsorActive) return;
          img.classList.remove('spon-in');
          img.classList.add('spon-out');
          wsSponsorOutHandler = (ev2) => {
            if (ev2.propertyName !== 'transform') return;
            img.removeEventListener('transitionend', wsSponsorOutHandler);
            if (!wsSponsorActive) return;
            wsSponsorIdx = (wsSponsorIdx + 1) % wsSponsors.length;
            runWsSponsorLoop();
          };
          img.addEventListener('transitionend', wsSponsorOutHandler);
        }, s.dur);
      };
      img.addEventListener('transitionend', wsSponsorInHandler);
    }

    function stopWsSponsorLoop() {
      wsSponsorActive = false;
      clearTimeout(wsSponsorHoldTimer);
      const img = document.getElementById('ws-sponsor-img');
      if (img) {
        img.removeEventListener('transitionend', wsSponsorInHandler);
        img.removeEventListener('transitionend', wsSponsorOutHandler);
      }
    }

    /* Hosts / Casters panels — alternate with Today's Matches every 6s. Each
       talent's cutout photo lives at a fixed position folder —
       /photos/TALENTS/<Position>/<NAME>_<POSITION>.png — matching the
       Left/Middle/Right crop it was made for. Hosts use Left/Right when only
       2 are configured, Left/Middle/Right once a 3rd is added; Casters
       always use Left/Middle/Right (3 slots) in the order the match board
       lists them. */
    const TALENT_HOST_POS_ORDER   = ['Left', 'Right'];
    const TALENT_HOST3_POS_ORDER  = ['Left', 'Middle', 'Right'];
    const TALENT_CASTER_POS_ORDER = ['Left', 'Middle', 'Right'];
    function talentPhotoTag(name, pos, slotClass) {
      const src = `/photos/TALENTS/${pos}/${name.toUpperCase()}_${pos.toUpperCase()}.png`;
      const cls = slotClass ? `ws-talent-photo-slot ${slotClass}` : 'ws-talent-photo-slot';
      return `<div class="${cls}"><img class="ws-talent-photo" ` +
        `src="${src}" onerror="this.style.display='none'" alt="${name}"></div>`;
    }
    /* Builds one talent box's innerHTML (Hosts or Casters); returns how many
       names were actually shown so the carousel can skip empty panels. */
    function populateWsTalentBox(rootId, list, bgAsset, posOrder, slotPrefix) {
      const names = ((list) || []).filter(n => n && n !== 'None').slice(0, posOrder.length);
      const root = document.getElementById(rootId);
      if (names.length < 1) { root.innerHTML = ''; return 0; }
      /* 3-up gets crowded with a dashed divider — the blank NAMEBOX frame
         gives long names room to breathe (the auto-fit pass below still
         shrinks them further if needed). Every slot gets a stable
         "<slotPrefix>-slot-<pos>" class (e.g. ws-hosts-slot-left,
         ws-casters-slot-middle) so the dashboard Edit panel can position/
         size each one independently regardless of how many are showing.
         slotPrefix defaults to rootId — ENTVC.html's EN Casters box passes
         a distinct prefix ('ws-encasters') so its slots can be positioned
         independently of mplfs.html's real Casters, which share this same
         function but keep the plain 'ws-casters' prefix. */
      const prefix = slotPrefix || rootId;
      const namebarImg = names.length === 2 ? 'NAMEBOX2.png' : 'NAMEBOX.png';
      const slotClass = i => `${prefix}-slot-${posOrder[i].toLowerCase()}`;
      const photosHtml = names.map((n, i) => talentPhotoTag(n, posOrder[i], slotClass(i))).join('');
      const namesHtml = names.map(n => `<div class="ws-talent-name">${n.toUpperCase()}</div>`).join('');
      root.innerHTML =
        `<img class="ws-talent-bg" src="${WS_TVC_ASSET}${bgAsset}" alt="">` +
        `<div class="ws-talent-photos ws-talent-count-${names.length}">${photosHtml}</div>` +
        `<div class="ws-talent-namebar"><img src="${WS_TVC_ASSET}${namebarImg}" alt="">` +
        `<div class="ws-talent-names">${namesHtml}</div></div>`;
      wsAutoFitTalentNames(root);
      return names.length;
    }
    /* Shrinks each name to fit its column (classic scrollWidth/clientWidth
       auto-fit), then unifies every name in the box to the smallest size
       found so they don't look mismatched next to each other. */
    function wsAutoFitTalentNames(root) {
      const MAX_SIZE = 27, MIN_SIZE = 13;
      const els = root.querySelectorAll('.ws-talent-name');
      if (!els.length) return;
      let smallest = MAX_SIZE;
      els.forEach(el => {
        let size = MAX_SIZE;
        el.style.fontSize = size + 'px';
        while (el.scrollWidth > el.clientWidth && size > MIN_SIZE) {
          size -= 1;
          el.style.fontSize = size + 'px';
        }
        smallest = Math.min(smallest, size);
      });
      els.forEach(el => { el.style.fontSize = smallest + 'px'; });
    }

    let wsHostsCount = 0, wsHostsLastKey = null;
    function populateWsHosts(ms) {
      const hosts = ((ms && ms.hosts) || []).filter(h => h && h !== 'None').slice(0, TALENT_HOST3_POS_ORDER.length);
      const key = hosts.join('|');
      if (key === wsHostsLastKey) return; /* unchanged — don't disturb a panel mid-display */
      wsHostsLastKey = key;
      const hostPosOrder = hosts.length >= 3 ? TALENT_HOST3_POS_ORDER : TALENT_HOST_POS_ORDER;
      wsHostsCount = populateWsTalentBox('ws-hosts', hosts, 'HOST_BOXv1.png', hostPosOrder);
      if (wsHostsCount < 1) wsPanelDropIfShowing(WS_HOSTS_IDX);
    }
    let wsCastersCount = 0, wsCastersLastKey = null;
    function populateWsCasters(ms) {
      // ENTVC.html sources the caster panel from EN Casters, not Casters —
      // this is the one behavioral difference from mplfs.html's Waiting TVC.
      const casters = ((ms && ms.enCasters) || []).filter(c => c && c !== 'None').slice(0, TALENT_CASTER_POS_ORDER.length);
      const key = casters.join('|');
      if (key === wsCastersLastKey) return;
      wsCastersLastKey = key;
      wsCastersCount = populateWsTalentBox('ws-casters', casters, 'CASTER_BOXv1.png', TALENT_CASTER_POS_ORDER, 'ws-encasters');
      if (wsCastersCount < 1) wsPanelDropIfShowing(WS_CASTERS_IDX);
    }

    /* Matches ⇄ Hosts ⇄ Casters carousel — flips every 6s while the waiting
       screen is up, automatically skipping any panel with fewer than 2
       talents configured (Today's Matches always has content). */
    const WS_PANEL_IDS = ['ws-matches', 'ws-hosts', 'ws-casters'];
    const WS_MATCHES_IDX = 0, WS_HOSTS_IDX = 1, WS_CASTERS_IDX = 2;
    let wsPanelInt = null, wsPanelCurrent = WS_MATCHES_IDX;
    function wsPanelHasContent(idx) {
      if (idx === WS_HOSTS_IDX) return wsHostsCount >= 1;
      if (idx === WS_CASTERS_IDX) return wsCastersCount >= 1;
      return true;
    }
    function wsNextPanelIndex(from) {
      for (let step = 1; step <= WS_PANEL_IDS.length; step++) {
        const idx = (from + step) % WS_PANEL_IDS.length;
        if (wsPanelHasContent(idx)) return idx;
      }
      return from;
    }
    function wsSwapPanel(fromIdx, toIdx) {
      if (fromIdx === toIdx) return;
      const outEl = document.getElementById(WS_PANEL_IDS[fromIdx]);
      const inEl  = document.getElementById(WS_PANEL_IDS[toIdx]);
      outEl.classList.remove('ws-panel-in');
      outEl.classList.add('ws-panel-out');
      setTimeout(() => {
        inEl.classList.remove('ws-panel-out');
        inEl.classList.add('ws-panel-in');
      }, 300);
      wsPanelCurrent = toIdx;
    }
    /* If a panel that's currently on screen just lost enough talents to show
       (e.g. edited down to 1 host while its box was up), cut back to matches
       immediately instead of waiting for the next 6s tick. */
    function wsPanelDropIfShowing(idx) {
      if (wsPanelCurrent === idx) wsSwapPanel(idx, WS_MATCHES_IDX);
    }
    function startWsPanelCycle() {
      clearInterval(wsPanelInt);
      wsPanelCurrent = WS_MATCHES_IDX;
      WS_PANEL_IDS.forEach(id => document.getElementById(id).classList.remove('ws-panel-out', 'ws-panel-in'));
      wsPanelInt = setInterval(() => {
        const next = wsNextPanelIndex(wsPanelCurrent);
        wsSwapPanel(wsPanelCurrent, next);
      }, 6000);
    }
    function stopWsPanelCycle() {
      clearInterval(wsPanelInt);
      wsPanelInt = null;
      wsPanelCurrent = WS_MATCHES_IDX;
      WS_PANEL_IDS.forEach(id => document.getElementById(id).classList.remove('ws-panel-out', 'ws-panel-in'));
    }

    /* Staggered slide-in — title first, then each row, left to right */
    function wsMatchesSlideIn(rootId) {
      [...document.getElementById(rootId).children].forEach((el, i) => {
        el.style.animation = 'none';
        void el.offsetWidth; /* restart the animation on every show */
        el.style.animation = `wsm-slide-in 520ms cubic-bezier(0.22, 1, 0.36, 1) ${i * 140}ms both`;
      });
    }

    /* Week/day chip + match rows + countdown label follow the Match Board state */
    function updateWsFromState(ms) {
      if (!ms) return;
      syncClockOffset(ms);
      if (ms.week != null && ms.day != null) {
        document.getElementById('ws-week-label').textContent = 'WEEK ' + ms.week + ' - DAY ' + ms.day;
      }
      buildWsMatches('ws-matches', msToMatchRows(ms) || WS_MATCHES);
      populateWsHosts(ms);
      populateWsCasters(ms);
      const labelImg = document.getElementById('ws-timer-label-img');
      const label = ms.countdownLabel === 'SHOW RESUMES IN' ? 'SHOW RESUMES IN' : 'SHOW STARTS IN';
      /* These only exist under the Waiting Lobby asset folder (there is no
         "Waiting Screen" folder on disk) — same art, shared with that scene. */
      const labelSrc = '/assets/Waiting Lobby/' + label + '.png';
      if (labelImg.getAttribute('src') !== labelSrc) labelImg.src = labelSrc;
      wsTimerState = ms.timer || WS_TIMER_DEFAULT;
    }

    async function showWaitingScreen() {
      const msPromise = fetch(buildUrl('/match/state'), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null).catch(() => null);
      await transitionTo('waiting');
      const ms = await msPromise;
      if (activeFeature !== 'waiting') return; /* superseded while awaiting match state */
      updateWsFromState(ms);
      showSceneVideo('waiting');
      startWsTimer();
      startWsSponsorLoop();
      startWsPanelCycle();
      wsMatchesSlideIn('ws-matches');
      wsPage.classList.add('ws-on');
      void wsPage.offsetWidth; /* force reflow so the opacity transition runs */
      wsPage.classList.add('ws-visible');
    }

    /* Dashboard Edit-panel hooks — show the waiting screen, then kill the
       6s Matches/Hosts/Casters carousel and pin it on the target panel so
       its photo slots stay put and selectable while the user drags/resizes
       them from the dashboard's Edit tab. */
    async function showCastersForEdit() {
      await showWaitingScreen();
      stopWsPanelCycle();
      wsSwapPanel(WS_MATCHES_IDX, WS_CASTERS_IDX);
    }
    async function showHostsForEdit() {
      await showWaitingScreen();
      stopWsPanelCycle();
      wsSwapPanel(WS_MATCHES_IDX, WS_HOSTS_IDX);
    }

    function hideWaitingScreen() {
      activeFeature = null;
      wsPage.classList.remove('ws-visible');
      return new Promise(resolve => {
        setTimeout(() => {
          wsPage.classList.remove('ws-on');
          hideSceneVideo();
          stopWsTimer();
          stopWsSponsorLoop();
          stopWsPanelCycle();
          resolve();
        }, 420);
      });
    }

    /* Sponsor category label — the white box at the left of every sponsor
       box, showing which category (Official Sponsor, Partner in Esports,
       etc.) is currently playing. Shrinks its font if a long category name
       still overflows the 105x86 box after wrapping (see CLAUDE.md's
       shrink-to-fit convention), never grows past the 15.5pt spec size. */
    function fitSponsorCatLabel(el) {
      if (!el) return;
      const maxSize = 15.5, minSize = 8;
      let size = maxSize;
      el.style.fontSize = size + 'px';
      while (el.scrollHeight > el.clientHeight && size > minSize) {
        el.style.fontSize = (size -= 0.5) + 'px';
      }
    }
    function updateSponsorCatLabel(labelId, category) {
      const el = document.getElementById(labelId);
      if (!el) return;
      el.textContent = category || '';
      fitSponsorCatLabel(el);
    }
    /* ── Tab leader election ──
       This page holds 1 persistent SSE connection open (/overlay/events —
       match-state and standings updates are fanned out over it too, as
       named events, rather than each getting their own connection; see
       connectSSE()). Chrome still caps HTTP/1.1 connections per origin at
       6, shared across every tab of that origin, so several tabs of this
       same page (or other pages hitting this origin) can still exhaust the
       pool between them — every other request (button-triggered fetches,
       image loads) on any of them then hangs indefinitely until one closes.
       Elect a single "leader" tab (via a localStorage heartbeat) to hold
       that connection; other tabs stay fully interactive for local button
       presses but skip the live SSE feed until they're promoted (e.g. the
       current leader tab is closed). */
    const LEADER_KEY = 'mplfs-leader-heartbeat';
    const LEADER_TIMEOUT_MS = 4000;
    const LEADER_CHECK_MS = 1500;
    const tabInstanceId = Math.random().toString(36).slice(2);
    let isSseLeader = false;

    function tryClaimLeadership() {
      let claimable = true;
      try {
        const raw = localStorage.getItem(LEADER_KEY);
        if (raw) {
          const { id, ts } = JSON.parse(raw);
          if (id !== tabInstanceId && Date.now() - ts < LEADER_TIMEOUT_MS) claimable = false;
        }
      } catch {}
      if (!claimable) return;
      try { localStorage.setItem(LEADER_KEY, JSON.stringify({ id: tabInstanceId, ts: Date.now() })); } catch {}
      if (!isSseLeader) {
        isSseLeader = true;
        sseDot.title = 'Live feed leader (this tab)';
        connectSSE(); // match + standings updates are fanned out over this same connection
      }
    }

    /* The dashboard's own Control-tab preview iframe (mplfs.html?preview=1)
       is a single known instance, not one of the "many broadcast tabs" the
       leader election above guards against — but it shares localStorage
       (same origin) with any standalone/OBS tab of this same page, so it
       was silently losing the leader election to whichever tab claimed it
       first and never opening its own SSE connection, leaving the preview
       stuck showing whatever was live at iframe-load time. Exempt it: it
       always gets its own connection, on top of whatever the elected
       leader is doing. */
    const isPreviewFrame = new URLSearchParams(location.search).get('preview') === '1';
    if (isPreviewFrame) {
      isSseLeader = true;
      sseDot.title = 'Live feed (dashboard preview)';
      connectSSE();
    } else {
      setInterval(() => {
        if (isSseLeader) {
          try { localStorage.setItem(LEADER_KEY, JSON.stringify({ id: tabInstanceId, ts: Date.now() })); } catch {}
        } else {
          tryClaimLeadership();
        }
      }, LEADER_CHECK_MS);
      sseDot.title = 'Waiting to become live-feed leader…';
      tryClaimLeadership();
    }


    /* ENTVC.html always shows the Waiting Screen TVC — it ignores whatever
       scene is live elsewhere (mplfs.html's activeFeature) instead of
       restoring it, since this page is a standalone Waiting TVC source.
       isReconnect (see sseSource.onopen) skips the re-call when it's
       already showing — showWaitingScreen() goes through the same
       non-idempotent transitionTo() as mplfs.html, so blindly recalling it
       after every reconnect would flicker the live scene for no reason. */
    async function restoreScene(isReconnect) {
      if (!isReconnect || requestedFeature !== 'waiting') showWaitingScreen();
    }
    restoreScene();

    document.addEventListener('keydown', e => {
      if (e.key === '`') {
        document.getElementById('config-bar').classList.toggle('debug-open');
      }
    });

    // Only one local debug card left (Waiting Screen TVC), so this is just
    // a toggle between showing and hiding it — no feature dispatch needed.
    function toggleLocalPreview(feature, btn) {
      const wasActive = btn.classList.contains('active');
      document.querySelectorAll('.dbg-btn.preview').forEach(b => b.classList.remove('active'));
      if (wasActive) {
        hideActiveFeature();
      } else {
        btn.classList.add('active');
        if (feature === 'waiting') showWaitingScreen();
      }
    }


    /* ── Load saved position/size overrides from dashboard editor ── */
    (function loadMplfsOverrides() {
      fetch(buildUrl('/api/overlay-styles?file=mplfs'))
        .then(function(r) { return r.json(); })
        .then(function(styles) {
          if (!styles || !Object.keys(styles).length) return;
          var css = Object.keys(styles).map(function(sel) {
            var props = styles[sel];
            var decls = Object.keys(props).map(function(prop) {
              var cssProp = prop === 'fontSize' ? 'font-size' : prop;
              return cssProp + ':' + props[prop] + ' !important';
            }).join(';');
            return sel + '{' + decls + '}';
          }).join('\n');
          var style = document.createElement('style');
          style.id = 'mplfs-overrides';
          style.textContent = css;
          document.head.appendChild(style);
        })
        .catch(function() {});
    })();

  </script>

</body>
</html>
